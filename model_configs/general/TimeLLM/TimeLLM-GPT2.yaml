# Time-LLM with GPT-2 backbone (lightweight)
# Good for quick experiments and limited GPU memory

model: TimeLLM

# =============================================================================
# GPT-2 Backbone (768 hidden dim, 12 layers, 117M params)
# =============================================================================
llm_model: gpt2
llm_layers: 6

# =============================================================================
# Architecture (tuned for GPT-2's smaller size)
# =============================================================================
patch_len: 16
stride: 8
d_model: 16
d_ff: 32
n_heads: 8
dropout: 0.1

# =============================================================================
# Prompt Configuration
# =============================================================================
prompt_domain: false
dataset_description: ""

# =============================================================================
# Task
# =============================================================================
task: TSF


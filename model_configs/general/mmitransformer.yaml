model: mmitransformer
d_model: 128
d_ff: 128
output_attention: False
use_norm: True
dropout: 0.1
factor: 1
n_heads: 8
activation: gelu
e_layers: 2
task: TGTSF

# Text Encoder Parameters (Original MMiTransformer)
text_dim: 384  # BERT embedding dimension
stride: 8  # Used to calculate expected number of patches
num_recent_patches: null  # Number of recent patches to use (null = use all available)



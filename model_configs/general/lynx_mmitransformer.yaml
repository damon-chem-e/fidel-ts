model: lynx_mmitransformer
d_model: 128
d_ff: 128
output_attention: False
use_norm: True
dropout: 0.1
factor: 1
n_heads: 8
activation: gelu
e_layers: 2
task: TGTSF

# Text Encoder Parameters
text_dim: 384
stride: 8

# Channel Description Parameters
channel_desc_dim: 64  # M dimension for channel descriptions

# News Embedding Parameters
num_text_variates: 1  # K: number of global text variates (default 1, can be increased for ablation)
news_num_heads: 4  # Number of attention heads for news aggregation transformer
news_num_layers: 2  # Number of transformer layers for news aggregation (or flat aggregator)
news_aggregation_type: hierarchical  # 'hierarchical' (default, Option B) or 'flat' (Option A)

# Sequence Dimension Support (for text self-attention)
use_text_sequence: false  # Set to true if input has sequence dimension [B, L, N, seq_len, text_dim]
token_num_heads: 4
token_num_layers: 1
article_num_heads: 4  # Attention heads for article pooling (attention over N dimension)
article_num_layers: 1  # Number of transformer layers for article pooling
text_temporal_num_heads: 4
text_temporal_num_layers: 2
text_temporal_num_blocks: 2  # Number of stacked temporal transformer blocks
text_temporal_per_head: true

# Alternating Blocks (for hierarchical aggregation)
news_num_blocks: 1  # Number of alternating (temporal + text) blocks
news_num_temporal_layers_per_block: 2  # Temporal transformer layers per block
news_num_text_layers_per_block: 2  # Text self-attention layers per block (only if use_text_sequence=true)


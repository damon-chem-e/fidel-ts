# lynx-film-raw Model Configuration
# lynx-film-raw uses FiLM to modulate iTransformer for raw signal learning
# (No pretrained unimodal model - learns entire structure from scratch)

model: lynx_film_raw

# Model Parameters (iTransformerFilm)
individual: False
enc_in: 1
e_layers: 3       # Layers in iTransformerFilm
n_heads: 4
d_model: 256
d_ff: 1024        # Feed forward dimension (typically 4*d_model)
dropout: 0.3
activation: "gelu"
output_attention: False
use_norm: False   # Normalization handled externally (via revin or use_norm flag)
factor: 1         # Attention factor

# Text Encoder Parameters (used to generate text embeddings for FiLM)
cross_layers: 3
self_layers: 3
text_dim: 256     # Dimension of text embeddings (input to FiLM)
text_encoder_type: "cross"        # Options: "cross", "self", "mlp"
text_encoder_mlp_hidden_dim: null # Hidden dim for MLP encoder (if text_encoder_type="mlp")
text_encoder_mlp_dropout: 0.0     # Dropout for MLP encoder (if text_encoder_type="mlp")
film_hidden_dim: null  # Optional FiLM MLP bottleneck (e.g., 128). null uses d_model.
film_dropout: 0.0      # Dropout inside FiLM MLP for regularization
text_film_weight_norm: false      # Apply weight norm to text/FiLM Linear layers
text_film_spectral_norm: false    # Apply spectral norm to text/FiLM Linear layers
text_film_per_channel: true       # If false, share FiLM params across channels (averages text over C)

# Normalization
# Choose one normalization scheme:
# - revin: True for RevIN normalization (like TGTSF)
# - use_norm: True for iTransformer normalization (Non-stationary Transformer)
# Note: Only one should be True. If both False, no normalization is applied.
revin: True       # Use RevIN normalization (recommended, similar to TGTSF)
# use_norm: False # Alternative: use iTransformer normalization

# Other
patch_len: 6
stride: 3
hetero_align_stride: True
task: TGTSF

# Training stability
# Gradient clipping max norm (null disables clipping)
grad_clip_max_norm: null
# Gradient clipping mode: "fixed", "ema", or "none"
grad_clip_mode: fixed
# EMA-based gradient clipping options (used when grad_clip_mode: "ema")
grad_clip_ema_beta: 0.95
grad_clip_ema_mult: 2.0
grad_clip_ema_warmup_steps: 0
grad_clip_ema_warmup_max_norm: null
grad_clip_ema_min: null
grad_clip_ema_max: null
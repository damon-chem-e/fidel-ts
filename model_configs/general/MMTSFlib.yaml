# MM-TSFlib Model Configuration
# Prediction-level late fusion based on MM-TSFlib / Time-MMD
#
# Architecture:
#   1. Any unimodal TS model produces predictions
#   2. Text embeddings projected via MLP to prediction dim
#   3. Pooled and normalized
#   4. Ensemble: (1-w)*ts_pred + w*(text_pred + prior)
#
# Reference:
#   MM-TSFlib: https://github.com/AdityaLab/MM-TSFlib
#   Time-MMD: https://github.com/AdityaLab/Time-MMD

model: MMTSFlib

# =============================================================================
# Unimodal Time Series Model Configuration
# =============================================================================

# Which unimodal model to wrap as the TS backbone
# Options: PatchTST, DLinear, iTransformer, FEDformer, Informer, FITS, Autoformer
unimodal_model_type: "iTransformer"

# Base time series parameters (passed to unimodal model)
seq_len: 96
pred_len: 24
enc_in: 1

# =============================================================================
# iTransformer Parameters (default backbone)
# =============================================================================
d_model: 512
n_heads: 8
e_layers: 2
d_ff: 2048
dropout: 0.1
activation: gelu
use_norm: True

# =============================================================================
# PatchTST Parameters (if using unimodal_model_type: PatchTST)
# =============================================================================
# These defaults are used when PatchTST is selected as the backbone.
# Override in experiment config as needed.
patch_len: 16
stride: 8
padding_patch: end
revin: True
affine: False
subtract_last: False
decomposition: False
kernel_size: 25
notrans: False
fc_dropout: 0.3
head_dropout: 0

# =============================================================================
# DLinear Parameters (if using unimodal_model_type: DLinear)
# =============================================================================
# Uncomment if using DLinear as backbone:
individual: False

# =============================================================================
# Text Processing Configuration
# =============================================================================

# Dimension of input text embeddings from LLMEmbeddingProvider
# MUST match the LLM model's hidden dimension:
#   - 768: GPT-2 base, BERT-base
#   - 1024: GPT-2 medium
#   - 1280: GPT-2 large
#   - 1600: GPT-2 xl
#   - 3584: Qwen2.5-7B
#   - 4096: LLaMA, Mistral
#   - 8192: Qwen2.5-72B
input_text_dim: 768

# =============================================================================
# LLM Embedding Precomputation (Required)
# =============================================================================
#
# MMTSFlib requires precomputed LLM embeddings. Generate them using:
#
#   python -m cli.inference generate <experiment_config.yaml>
#
# Your experiment config must include an llm_embedding section:
#
#   llm_embedding:
#     model_name: "gpt2"                    # HuggingFace model name
#     cache_dir: "./LLM_cache/"             # Model weights cache
#     extraction_mode: "last_token"         # "last_token" or "pooled"
#     max_length: 512                       # Max token length
#     prompt_template: "mmtsflib_v1"        # MM-TSFlib prompt template
#     batch_size: 64                        # LLM inference batch size
#
# MM-TSFlib Prompt Format:
#   "<|start_prompt|>Make predictions about the future based on the
#    following information: {time_series_description}<|end_prompt|>"
#
# The embeddings are cached and loaded via hetero_general/dataset_description.
# See docs/embedder.md for full documentation.

# MLP projection parameters
# Hidden dimension = input_text_dim / text_mlp_reduction
# Original MM-TSFlib uses reduction=8 (e.g., 768 -> 96 -> pred_len)
text_mlp_reduction: 8
text_mlp_dropout: 0.3

# Pooling strategy for aggregating token embeddings
# Options:
#   - avg: Global average pooling (most stable, recommended)
#   - max: Global max pooling
#   - min: Global min pooling
#   - attention: Attention-weighted pooling using TS predictions
pool_type: "avg"

# =============================================================================
# Fusion Configuration
# =============================================================================

# Prompt weight mode: 'fixed' (hyperparameter) or 'learned' (trainable)
# Use 'learned' to let the model find optimal mixing weight during training
prompt_weight_mode: "fixed"

# Mixing weight w in ensemble formula: (1-w)*ts_pred + w*text_pred
# MM-TSFlib default is 0.01, meaning 99% TS and 1% text
# This can be tuned per dataset - higher values give more weight to text
# Recommended range: 0.001 to 0.2
# Used when prompt_weight_mode: "fixed"
prompt_weight: 0.01

# Initial value for learned prompt weight
# Only used when prompt_weight_mode: "learned"
# The learned weight will start near this value (via inverse sigmoid initialization)
prompt_weight_initial: 0.01

# Whether to add historical prior to text predictions
# Original MM-TSFlib uses prior_history_avg from the Time-MMD dataset
# Set to True if your dataset provides prior_y values
use_prior: False

# =============================================================================
# Task Configuration
# =============================================================================

task: TGTSF  # Text-guided time series forecasting

# =============================================================================
# Training Parameters (used by trainer)
# =============================================================================

learning_rate: 0.0001
batch_size: 32
train_epochs: 50
patience: 10

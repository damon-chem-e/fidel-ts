# LLM Embedding Configuration - Qwen 72B with 4-bit Quantization
# For GPUs with 48-80GB VRAM (L40S, A100-40GB, A100-80GB)
#
# Uses 4-bit quantization to fit the 72B model in memory while preserving
# most of the embedding quality. For full-quality, use default.yaml on H200.
#
# Memory requirements:
#   - fp16 (no quantization): ~140GB (H200 only)
#   - 8bit quantization: ~70GB (A100-80GB)
#   - 4bit quantization: ~40GB (L40S, A100-40GB, A100-80GB)
#
# USAGE:
#   python -m cli.inference generate <dataset> model_configs/llm_embedding/qwen_72b.yaml

llm_embedding:
  # ============================================================================
  # LLM Model Settings
  # ============================================================================
  
  # Qwen 2.5 72B Instruct with quantization
  model_name: "Qwen/Qwen2.5-72B-Instruct"
  
  # Local cache directory
  cache_dir: "./LLM_cache/"
  
  # Device for inference
  device: "cuda:0"
  
  # ============================================================================
  # Quantization Settings
  # ============================================================================
  
  # 4-bit quantization for GPUs with < 141GB VRAM
  # - "4bit": Fits in ~40GB, slight quality reduction
  # - "8bit": Fits in ~70GB, minimal quality loss
  # - null: fp16, requires ~140GB (use default.yaml for H200)
  quantization: "4bit"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  
  extraction_mode: "last_token"
  max_length: 512
  
  # ============================================================================
  # Prompt Settings
  # ============================================================================
  
  prompt_template: "timecma_v1"
  prompt_config:
    value_format: "integer"
    include_timestamps: true
  
  # ============================================================================
  # Data Settings
  # ============================================================================
  
  data_root: "./data/"
  
  # ============================================================================
  # Batch Processing
  # ============================================================================
  
  # Smaller batch size for 4-bit 72B
  batch_size: 4

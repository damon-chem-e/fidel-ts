# LLM Embedding Configuration - GPT-2 (Development / Quick Testing)
# For quick development and testing with minimal GPU requirements
#
# GPT-2 base is very small (~500MB) and runs fast on any GPU.
# Use this for development and testing. For production, use Qwen models.
#
# Memory requirements:
#   - fp16: ~500MB (any GPU)
#
# USAGE:
#   python -m cli.inference generate <dataset> model_configs/llm_embedding/gpt2.yaml

llm_embedding:
  # ============================================================================
  # LLM Model Settings
  # ============================================================================
  
  # GPT-2 base - fast for testing
  model_name: "gpt2"
  
  # Local cache directory
  cache_dir: "./LLM_cache/"
  
  # Device for inference
  device: "cuda:0"
  
  # ============================================================================
  # Quantization Settings
  # ============================================================================
  
  # No quantization needed for GPT-2 (it's already small)
  quantization: null
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  
  extraction_mode: "last_token"
  max_length: 512
  
  # ============================================================================
  # Prompt Settings
  # ============================================================================
  
  prompt_template: "timecma_v1"
  prompt_config:
    value_format: "integer"
    include_timestamps: true
  
  # ============================================================================
  # Data Settings
  # ============================================================================
  
  data_root: "./data/"
  
  # ============================================================================
  # Batch Processing
  # ============================================================================
  
  # Large batch size for fast inference
  batch_size: 64


# WandB Sweep Configuration: lynx_film_raw Test Sweep
# Description: Test sweep with architecture parameters (e_layers, d_model, n_heads) and training hyperparameters (LR, batch_size)
# Purpose: Test wandb sweep integration with architecture + training parameters on smaller dataset
# Usage: wandb sweep configs/sweep_configs/lynx_film_raw_test_sweep.yaml --project fidel-ts
# NOTE: Optimizes on test_loss (not val_loss) to avoid lookahead bias in validation loss.
# See docs/train_val_test_purge_period_issue.md for details.

program: scripts/wandb_sweep_wrapper.py
method: random  # Use random for simplicity in testing
metric:
  name: test_loss
  goal: minimize

# Base suite config to sweep over
_config_path: "configs/experiment_suites/lynx_film_raw_test_sweep.yaml"

# Hyperparameters to sweep
parameters:
  # Model Architecture Parameters (via model_config_overrides)
  # These override values in model_configs/general/lynx_film_raw.yaml
  model_config_overrides.e_layers:  # Depth: number of transformer layers
    values: [1, 2]
  
  model_config_overrides.d_model:  # Width: model dimension
    values: [512, 768, 1024]
  
  # Training Hyperparameters
  training.learning_rate:
    distribution: log_uniform_values  # Use _values variant for actual value range
    min: 1.5e-4  # Tightened around good range (0.0002-0.0003)
    max: 4e-4
  
  training.batch_size:
    values: [8, 12]  # Below 64, focused around 16 or lower

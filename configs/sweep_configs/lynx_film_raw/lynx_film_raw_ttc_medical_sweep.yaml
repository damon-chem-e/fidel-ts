# WandB Sweep Configuration: lynx_film_raw TTC Medical Sweep
# Description: Architecture and training hyperparameter sweep on TTC Medical dataset
# Purpose: Sweep e_layers, d_model, n_heads, batch_size, and learning rate on TTC Medical
# Usage: wandb sweep configs/sweep_configs/lynx_film_raw/lynx_film_raw_ttc_medical_sweep.yaml --project fidel-ts
# NOTE: Optimizes on val_loss with truncate_train_for_purge to avoid lookahead bias.

program: scripts/wandb_sweep_wrapper.py
method: random  # Use random for exploration across parameter space
metric:
  name: val_loss
  goal: minimize

# Base suite config to sweep over
_config_path: "configs/experiment_suites/lynx_film_raw_ttc_medical_sweep.yaml"

# Hyperparameters to sweep
parameters:
  # Model Architecture Parameters (via model_config_overrides)
  # These override values in model_configs/general/lynx_film_raw.yaml
  
  model_config_overrides.e_layers:  # Depth: number of transformer layers
    values: [2, 3, 4]
  
  model_config_overrides.d_model:  # Width: model dimension
    values: [256, 384, 512, 768]
  
  model_config_overrides.n_heads:  # Number of attention heads
    values: [4, 8, 12]

  # Text Encoder Options
  model_config_overrides.text_encoder_type:
    values: ["cross", "self", "mlp"]

  model_config_overrides.cross_layers:
    values: [0, 1, 2, 3]

  model_config_overrides.self_layers:
    values: [1, 2, 3]

  model_config_overrides.text_encoder_mlp_hidden_dim:
    values: [64, 128, 256, 512]

  model_config_overrides.text_encoder_mlp_dropout:
    values: [0.0, 0.1, 0.2]

  # FiLM Generator Regularization
  model_config_overrides.film_hidden_dim:
    values: [64, 128, 256, 384]

  model_config_overrides.film_dropout:
    values: [0.0, 0.1, 0.2]

  model_config_overrides.text_film_weight_norm:
    values: [false]  # Keep disabled to avoid conflicts with spectral norm

  model_config_overrides.text_film_spectral_norm:
    values: [false, true]
  
  # Training Hyperparameters
  training.learning_rate:
    distribution: log_uniform_values  # Use _values variant for actual value range
    min: 1e-4
    max: 5e-4

  training.text_film_learning_rate:
    distribution: log_uniform_values
    min: 5e-5
    max: 2e-4

  training.text_film_weight_decay:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-3
  
  training.batch_size:
    values: [8, 16, 32, 64, 128]

# WandB Sweep Configuration: lynx_film_raw Architecture + Training Hyperparameters
# Description: Sweeps over model architecture (depth, width) and training hyperparameters (LR, batch size)
# Method: Bayesian optimization for efficient search
# Usage: wandb sweep configs/sweep_configs/lynx_film_raw/lynx_film_raw_architecture_sweep.yaml --project fidel-ts
# NOTE: Optimizes on final_val_loss with truncate_train_for_purge enabled, making val_loss reliable for HPO.
# See docs/train_val_test_purge_period_issue.md for details.

program: scripts/wandb_sweep_wrapper.py
method: bayes  # Bayesian optimization for efficient hyperparameter search
metric:
  name: final_val_loss  # Reliable with truncate_train_for_purge enabled in experiment suite
  goal: minimize

# Early stopping to save compute
early_terminate:
  type: hyperband
  min_iter: 3
  max_iter: 7
  s: 2

# Base suite config to sweep over
_config_path: "configs/experiment_suites/lynx_film_raw_hparam_sweep.yaml"

# Hyperparameters to sweep
parameters:
  # Model Architecture Parameters (via model_config_overrides)
  # These override values in model_configs/general/lynx_film_raw.yaml
  
  model_config_overrides.d_model:  # Width: model dimension
    values: [128, 256, 512]
  
  model_config_overrides.n_heads:  # Number of attention heads
    values: [4, 8]
  
  # Training Hyperparameters
  training.learning_rate:
    distribution: log_uniform_values  # Use _values variant for actual value range
    min: 1e-5
    max: 1e-2
  
  training.batch_size:
    values: [256, 512, 768, 1024]

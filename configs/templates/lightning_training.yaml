# Template: PyTorch Lightning Training
# Description: Base template for PyTorch Lightning-based model training
# This template can be extended by experiment suite configs

experiment:
  name: "${experiment_name}"  # Placeholder filled by suite
  type: "lightning"
  
model:
  name: "${model_name}"  # Placeholder
  config_path: "${model_config_path}"  # Placeholder
  
data:
  name: "${data_name}"  # Placeholder
  config_path: "${data_config_path}"  # Placeholder
  
training:
  epochs: 20
  batch_size: 96
  learning_rate: 5e-4
  patience: 3
  loss: "mse"
  lradj: "type3"
  input_len: 360
  output_len: 24  # Can be overridden with output_lens list
  scale: true
  disable_buffer: false
  preload_hetero: false
  prefetch_factor: 2
  num_workers: 0
  noise: 0.0
  downsample: null
  checkpoints: "./checkpoints/"
  random_seed: 2021
  precision: null  # 32, 16, or bf16
  gradient_clip_val: null
  test_after_epoch: false
  
  # PyTorch Compile (PyTorch 2.0+ optimization) - optional
  # torch_compile: true  # Enable torch.compile for faster training (default: false)
  # compile_mode: "reduce-overhead"  # Compile mode: default, reduce-overhead, max-autotune (default: reduce-overhead)
  
  # Tracking
  track_per_sample: true  # Whether to track per-sample metrics (Parquet) - enables per-sample and per-channel loss tracking
  
  # Evaluation during training
  evaluate_test_during_training: false  # Whether to evaluate on test set during training epochs (default: false to hold out test until final evaluation)
  
device:
  use_gpu: true
  gpu: 0
  use_multi_gpu: false
  devices: "0,1,2,3"
  
wandb:
  project: "fidel-ts"
  tags: []
  notes: ""
  enabled: true
  mode: "online"


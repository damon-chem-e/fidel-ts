# Experiment Suite: ZhangHanBest (PatchTST) on Time MMD and TTC datasets
# Description: Train ZhangHanBest with PatchTST encoder on all Time MMD and TTC datasets
# Notes:
# - Mirrors dataset, input_len, and output_len from lynx_film_raw/time_mmd_ttc.yaml
# - Uses batch_size=16 for Time MMD and TTC datasets
# - Uses constant learning rate 1e-4

suite:
  name: "zhanghanbest_patchtst_time_mmd_ttc"
  description: "ZhangHanBest (PatchTST encoder) on all Time MMD and TTC datasets"
  tags: ["zhanghanbest", "patchtst", "multimodal", "pytorch", "time_mmd", "ttc"]

  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/zhanghanbest_patchtst/time_mmd_ttc"
    
  experiments:
    # Time MMD datasets
    - name: "zhanghanbest_patchtst_timemmd_agriculture"
      description: "ZhangHanBest (PatchTST) on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "PatchTST"
          seq_len: 24
          pred_len: 6
          d_model: 512
          revin: true
          input_text_dim: 768
        data:
          name: "time_mmd_agriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          text_embedding_stride: "full"
          input_len: 24
          output_len: 6
          batch_size: 16
          learning_rate: 0.0001           # Time series model LR
          projector_learning_rate: 0.01   # Residual projection LR (100x higher per Zhang et al.)
          lradj: constant
          patience: 2
          epochs: 3
          track_per_sample: false
          evaluate_test_during_training: true
          truncate_train_for_purge: true
          torch_compile: true
          compile_mode: "reduce-overhead"
        wandb:
          tags: ["zhanghanbest", "patchtst", "time_mmd_agriculture"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_patchtst/time_mmd_ttc"


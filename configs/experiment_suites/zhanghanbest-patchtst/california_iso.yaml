# Experiment Suite: ZhangHanBest (PatchTST) on California_ISO
# Description: Train ZhangHanBest with PatchTST encoder on California_ISO dataset
# Usage: python -m cli.suite run configs/experiment_suites/zhanghanbest-patchtst/california_iso.yaml
# Notes:
# - Mirrors input/output lengths from lynx_film_raw/california_iso.yaml
# - Uses batch_size=256 for Fidel-TS datasets
# - Uses constant learning rate 1e-4

suite:
  name: "zhanghanbest_patchtst_california_iso"
  description: "ZhangHanBest (PatchTST encoder) on California_ISO with 15-day context, 1-week prediction"
  tags: ["zhanghanbest", "patchtst", "multimodal", "pytorch", "fidel-ts", "california_iso"]
  
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/zhanghanbest_patchtst/california_iso"
    
  experiments:
    - name: "zhanghanbest_patchtst_california_iso"
      description: "ZhangHanBest with PatchTST encoder on California_ISO (15-day context, 1-week prediction)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "PatchTST"
          seq_len: 360          # Match training.input_len
          pred_len: 168         # Match training.output_len
          d_model: 512
          revin: true
          input_text_dim: 768
        data:
          name: "California_ISO"
          config_path: "data_configs/California_ISO/fullCAISO_hetero_TGTSF_H.yaml"
        training:
          text_embedding_stride: "full"
          input_len: 360        # 15 days at hourly intervals
          output_len: 168       # 1 week at hourly intervals
          batch_size: 256
          learning_rate: 0.0001
          lradj: constant
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true
          torch_compile: true
          compile_mode: "reduce-overhead"
          use_tensor_cache: true
        wandb:
          tags: ["zhanghanbest", "patchtst", "california_iso"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_patchtst/california_iso"


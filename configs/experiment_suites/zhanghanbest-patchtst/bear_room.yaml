# Experiment Suite: ZhangHanBest (PatchTST) on Bear_room
# Description: Train ZhangHanBest with PatchTST encoder on Bear_room dataset
# Usage: python -m cli.suite run configs/experiment_suites/zhanghanbest-patchtst/bear_room.yaml
# Notes:
# - Mirrors input/output lengths from lynx_film_raw/bear_room.yaml
# - Uses batch_size=256 for Fidel-TS datasets
# - Uses constant learning rate 1e-4

suite:
  name: "zhanghanbest_patchtst_bear_room"
  description: "ZhangHanBest (PatchTST encoder) on Bear_room with 1-day context, 12-hour prediction"
  tags: ["zhanghanbest", "patchtst", "multimodal", "pytorch", "fidel-ts", "bear_room"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/zhanghanbest_patchtst/bear_room"
    
  # Experiments in this suite
  experiments:
    - name: "zhanghanbest_patchtst_bear_room"
      description: "ZhangHanBest with PatchTST encoder on Bear_room (1-day context, 12-hour prediction)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "PatchTST"
          seq_len: 288          # Match training.input_len
          pred_len: 144         # Match training.output_len
          d_model: 512
          revin: true
          input_text_dim: 768   # Text embedding dimension (BERT)
        data:
          name: "Bear_room"
          config_path: "data_configs/Bear_room/fullBear_hetero_TGTSF.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution text embeddings
          input_len: 288        # 1 day at 5-min intervals
          output_len: 144       # 12 hours at 5-min intervals
          batch_size: 256
          learning_rate: 0.0001           # Time series model LR
          projector_learning_rate: 0.01   # Residual projection LR (100x higher per Zhang et al.)
          lradj: constant       # Keep learning rate constant
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true
          torch_compile: true
          compile_mode: "reduce-overhead"
          use_tensor_cache: true
        wandb:
          tags: ["zhanghanbest", "patchtst", "bear_room"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_patchtst/bear_room"


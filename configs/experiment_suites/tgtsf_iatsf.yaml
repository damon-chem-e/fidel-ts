# Experiment Suite: TGTSF/IATSF Training
# Description: Training TGTSF (Text-Guided Time Series Forecasting) models across datasets
# Usage: python -m cli.suite run configs/experiment_suites/tgtsf_iatsf.yaml

suite:
  name: "tgtsf_iatsf_training"
  description: "Train TGTSF models across all datasets with heterogeneous data"
  tags: ["tgtsf", "iatsf", "lightning", "heterogeneous"]
  
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/tgtsf_iatsf"
    
  experiments:
    # NYC Traffic Speed
    - name: "tgtsf_nyc_traffic_speed"
      description: "TGTSF on NYC Traffic Speed dataset"
      enabled: true
      template: "configs/templates/lightning_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 360
          output_lens: [24, 168, 336, 720]
          batch_size: 256
          patience: 5
          epochs: 50
        device:
          use_multi_gpu: true
          devices: "0,1,4"
        experiment:
          type: "lightning"
          output_dir: "outputs/suites/tgtsf_iatsf"
    
    # California ISO
    - name: "tgtsf_california_iso"
      description: "TGTSF on California ISO dataset"
      enabled: true
      template: "configs/templates/lightning_training.yaml"

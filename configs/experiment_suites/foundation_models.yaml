# Experiment Suite: Foundation Models
# Description: Comprehensive evaluation of foundation models (Sundial, TimeMoE, Chronos) across datasets
# Usage: python -m cli.suite run configs/experiment_suites/foundation_models.yaml

suite:
  name: "foundation_models_comprehensive"
  description: "Evaluate foundation models (Sundial, TimeMoE, Chronos) across datasets"
  tags: ["foundation_models", "fm", "comprehensive"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/foundation_models"
    
  # Experiments in this suite
  experiments:
    # Sundial - NYC Traffic Speed
    - name: "sundial_nyc_traffic_speed"
      description: "Sundial on NYC Traffic Speed dataset"
      enabled: true
      template: "configs/templates/fm_testing.yaml"
      overrides:
        model:
          name: "Sundial"
          config_path: "model_configs/FM/Sundial.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_H.yaml"
        training:
          input_len: 360
          output_lens: [24, 168, 336, 720]
          batch_size: 1024
        device:
          gpu: 3
        experiment:
          type: "fm"
          output_dir: "outputs/suites/foundation_models"
    
    # Sundial - California ISO
    - name: "sundial_california_iso"
      description: "Sundial on California ISO dataset"
      enabled: true
      template: "configs/templates/fm_testing.yaml"
      overrides:
        model:
          name: "Sundial"
          config_path: "model_configs/FM/Sundial.yaml"
        data:
          name: "California_ISO"
          config_path: "data_configs/California_ISO/fullCAISO_H.yaml"
        training:

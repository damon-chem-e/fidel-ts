# Experiment Suite: LeRet on Time MMD and TTC datasets
# Description: Train LeRet model on all Time MMD (Liu et al., 2024b) and TTC (Kim et al., 2024) datasets
# Usage: python -m cli.suite run configs/experiment_suites/leret/time_mmd_ttc.yaml
# Note: Input/output lens follow Table 4 from the original papers:
#       - Time MMD datasets use 7:1:2 train/val/test ratio splits
#       - TTC datasets use 7:1:2 train/val/test ratio splits
#       Uses y_hetero (text embeddings) with timestamp_semantics: t_about

suite:
  name: "leret_time_mmd_ttc"
  description: "Train LeRet model on all Time MMD and TTC datasets with text embeddings"
  tags: ["leret", "retention", "pytorch", "time_mmd", "ttc", "text-embeddings"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/leret/time_mmd_ttc"
    
  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================
    
    # Agriculture: context=24, prediction=6
    - name: "leret_timemmd_agriculture"
      description: "LeRet with text embeddings on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "LeRet"
          config_path: "model_configs/general/LeRet.yaml"
        data:
          name: "time_mmd_agriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          text_embedding_stride: "full"  # Full resolution (LeRet may not use hetero data, but safe to include)
          input_len: 24       # Context length from Table 4
          output_len: 6       # Prediction length from Table 4
          batch_size: 12
          learning_rate: 0.00022
          patience: 2
          epochs: 50  # Total epochs (pretrain + finetune)
          track_per_sample: false
          evaluate_test_during_training: true
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
          # LeRet-specific two-stage training
          leret:
            training_stage: "both"
            pretrain_epochs: 25  # 50% of total epochs (25/25 split)
            pretrain_loss: "mse"
            finetune_loss: "mse"
            pretrain_learning_rate: 1e-3
        wandb:
          tags: ["leret", "time_mmd_agriculture"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/leret/time_mmd_ttc"
        model_config_overrides:
          # Original LeRet hyperparameters
          d_model: 128
          n_heads: 8
          e_layers: 3
          d_ff: 256
          patch_len: 16
          stride: 8
          padding_patch: end
          revin: True
          affine: False
          subtract_last: False
          decomposition: False
          kernel_size: 25
          individual: False
          dropout: 0.05
          fc_dropout: 0.05
          head_dropout: 0.0
          # Text embedding configuration
          use_language: True
          language_dim: 768
          # Task type for text-guided forecasting
          task: TGTSF
          # Dataset-specific (enc_in will be inferred automatically)
          seq_len: 24
          pred_len: 6
    

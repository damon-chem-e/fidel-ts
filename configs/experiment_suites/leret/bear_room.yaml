# Experiment Suite: LeRet on Bear_room
# Description: Train LeRet model on Bear_room dataset with text embeddings
# Usage: python -m cli.suite run configs/experiment_suites/leret/bear_room.yaml
# Note: Bear_room uses 5-min sampling (not downsampled per paper)
#       Input: 288 samples = 1 day, Output: 144 samples = 12 hours (second smallest prediction)
#       Split points: {Sep. 1, 2020, Oct. 1, 2020}
#       Uses y_hetero (text embeddings) with timestamp_semantics: t_about

suite:
  name: "leret_bear_room"
  description: "Train LeRet model on Bear_room dataset with text embeddings, 1-day context, 12-hour prediction"
  tags: ["leret", "retention", "pytorch", "fidel-ts", "bear_room", "text-embeddings"]
  resume_suite_id: "leret_bear_room_20260117_233937"  

  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/leret/bear_room"
    
  # Experiments in this suite
  experiments:
    - name: "leret_bear_room"
      description: "LeRet with text embeddings on Bear_room with 1-day context, 12-hour prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "LeRet"
          config_path: "model_configs/general/LeRet.yaml"
        data:
          name: "Bear_room"
          config_path: "data_configs/Bear_room/fullBear_hetero_TGTSF.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution (LeRet may not use hetero data, but safe to include)
          input_len: 288      # 1 day at 5-min intervals (288 = 24h * 12)
          output_len: 144     # 12 hours at 5-min intervals (second smallest: {12, 144, 288, 576})
          batch_size: 128
          learning_rate: 8.66e-4
          patience: 5
          epochs: 20  # Total epochs (pretrain + finetune)
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
          # LeRet-specific two-stage training
          leret:
            training_stage: "both"
            pretrain_epochs: 10  # 50% of total epochs (10/10 split)
            pretrain_loss: "mse"
            finetune_loss: "mse"
            pretrain_learning_rate: 1e-3
        wandb:
          tags: ["leret", "bear_room"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/leret/bear_room"
        mark_last_job_complete: true
        resume_experiment_id: "20260117-233937_ec273d9eaff7"
        model_config_overrides:
          # Original LeRet hyperparameters
          d_model: 128
          n_heads: 8
          e_layers: 3
          d_ff: 256
          patch_len: 16
          stride: 8
          padding_patch: end
          revin: True
          affine: False
          subtract_last: False
          decomposition: False
          kernel_size: 25
          individual: False
          dropout: 0.05
          fc_dropout: 0.05
          head_dropout: 0.0
          # Text embedding configuration
          use_language: True
          language_dim: 768
          # Task type for text-guided forecasting
          task: TGTSF
          # Dataset-specific (enc_in will be inferred automatically)
          seq_len: 288
          pred_len: 144

# Experiment Suite: ChatTime Testing
# Description: ChatTime Foundation Model testing on filtered samples
# Usage: python -m cli.suite run configs/experiment_suites/chattime.yaml

suite:
  name: "chattime_testing"
  description: "ChatTime Foundation Model testing on filtered samples"
  tags: ["chattime", "fm", "filtered_samples", "tgtsf"]
  
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/chattime"
    
  experiments:
    # ChatTime - NYC Traffic Speed Day (TGTSF task)
    - name: "chattime_nyc_traffic_speed_day_tgtsf"
      description: "ChatTime on NYC Traffic Speed day-ahead filtered samples (TGTSF task)"
      enabled: true
      template: "configs/templates/fm_testing.yaml"
      overrides:
        model:
          name: "ChatTime"
          config_path: "model_configs/FM/ChatTime.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_LLM.yaml"
        training:
          input_len: 360
          output_len: 24
          batch_size: 1
          filtered_samples: "sample_indexes/NYC_traffic_speed_sample_day.json"
        device:
          gpu: 5
        hf_mirror: true
        experiment:
          type: "fm"
          output_dir: "outputs/suites/chattime"
          task: "TGTSF"  # Note: ChatTime uses TGTSF task, not TSF
    
    # ChatTime - NYC Traffic Speed Week (TGTSF task)
    - name: "chattime_nyc_traffic_speed_week_tgtsf"
      description: "ChatTime on NYC Traffic Speed week-ahead filtered samples (TGTSF task)"
      enabled: true
      template: "configs/templates/fm_testing.yaml"
      overrides:
        model:
          name: "ChatTime"
          config_path: "model_configs/FM/ChatTime.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_LLM.yaml"
        training:
          input_len: 360
          output_len: 168
          batch_size: 1
          filtered_samples: "sample_indexes/NYC_traffic_speed_sample_week.json"
        device:
          gpu: 5
        hf_mirror: true
        experiment:
          type: "fm"
          output_dir: "outputs/suites/chattime"
          task: "TGTSF"
    
    # ChatTime - California ISO Day (TGTSF task)

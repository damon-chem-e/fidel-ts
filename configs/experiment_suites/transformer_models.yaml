# Experiment Suite: Transformer Models
# Description: Comprehensive evaluation of transformer models (PatchTST, iTransformer) across all datasets
# Usage: python -m cli.suite run configs/experiment_suites/transformer_models.yaml

suite:
  name: "transformer_models_comprehensive"
  description: "Evaluate PatchTST and iTransformer models across all datasets with multiple forecast horizons"
  tags: ["transformer", "lightning", "comprehensive"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/transformer_models"
    
  # Experiments in this suite
  experiments:
    # NYC Traffic Speed
    - name: "patchtst_nyc_traffic_speed"
      description: "PatchTST on NYC Traffic Speed dataset"
      enabled: true
      template: "configs/templates/lightning_training.yaml"
      overrides:
        model:
          name: "PatchTST"
          config_path: "model_configs/general/PatchTST.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_H.yaml"
        training:
          input_len: 360
          output_lens: [24, 168, 336, 720]
          batch_size: 512
        experiment:
          type: "lightning"
          output_dir: "outputs/suites/transformer_models"
          
    - name: "itransformer_nyc_traffic_speed"
      description: "iTransformer on NYC Traffic Speed dataset"
      enabled: true
      template: "configs/templates/lightning_training.yaml"
      overrides:
        model:
          name: "iTransformer"
          config_path: "model_configs/general/iTransformer.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_H.yaml"
        training:
          input_len: 360
          output_lens: [24, 168, 336, 720]
          batch_size: 512

# Experiment Suite: TGTSF on Canada_photovoltaics_plants
# Description: Train TGTSF on Canada_photovoltaics_plants with same context/horizon as itransformer
# Usage: python -m cli.suite run configs/experiment_suites/tgtsf/canada_photovoltaics.yaml

suite:
  name: "tgtsf_canada_photovoltaics"
  description: "Train TGTSF model on Canada_photovoltaics_plants dataset with 15-day context, 1-week prediction"
  tags: ["tgtsf", "multimodal", "pytorch", "fidel-ts", "canada_photovoltaics"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/tgtsf/canada_photovoltaics"
    
  # Experiments in this suite
  experiments:
    - name: "tgtsf_canada_photovoltaics"
      description: "TGTSF on Canada_photovoltaics_plants with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        model_config_overrides:
          input_text_dim: 768  # Match the BERT embedding dimension from the cache
        data:
          name: "Canada_photovoltaics_plants"
          config_path: "data_configs/Canada_photovoltaics_plants/fullCPP_hetero_TGTSF.yaml"
        training:
          epochs: 50
          # Match itransformer Canada_photovoltaics input/output lengths
          input_len: 360      # 15 days at hourly intervals
          output_len: 168     # 1 week at hourly intervals (second smallest horizon)
          batch_size: 256     # From original TGTSF bash script (scripts/Canada_photovoltaics_plants/TGTSF.sh)
          learning_rate: 5.0e-4  # Default from run_lightning.py
          patience: 5         # From original TGTSF bash script (scripts/Canada_photovoltaics_plants/TGTSF.sh)
          # LR schedule is type3 via the template (constant 3 epochs, then 0.9 decay)
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          text_embedding_stride: "full"  # Use full resolution text embeddings (hetero_stride=1) to match cache
          use_tensor_cache: true  # Enable tensor cache
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["tgtsf", "canada_photovoltaics"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/tgtsf/canada_photovoltaics"

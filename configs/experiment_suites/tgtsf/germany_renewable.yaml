# Experiment Suite: TGTSF on Germany_Renewable_Power_Grid
# Description: Train TGTSF on Germany_Renewable_Power_Grid with same context/horizon as itransformer
# Usage: python -m cli.suite run configs/experiment_suites/tgtsf/germany_renewable.yaml

suite:
  name: "tgtsf_germany_renewable"
  description: "Train TGTSF model on Germany_Renewable_Power_Grid dataset with 15-day context, 1-week prediction"
  tags: ["tgtsf", "multimodal", "pytorch", "fidel-ts", "germany_renewable"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/tgtsf/germany_renewable"
    
  # Experiments in this suite
  experiments:
    - name: "tgtsf_germany_renewable"
      description: "TGTSF on Germany_Renewable_Power_Grid with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        data:
          name: "Germany_Renewable_Power_Grid"
          config_path: "data_configs/Germany_Renewable_Power_Grid/fullGRPG_hetero_TGTSF_H.yaml"
        training:
          epochs: 50
          # Match itransformer Germany_Renewable input/output lengths
          input_len: 360      # 15 days at hourly intervals
          output_len: 168     # 1 week at hourly intervals (second smallest horizon)
          batch_size: 256     # From original TGTSF bash script (scripts/Germany_Renewable_Power_Grid/TGTSF.sh)
          learning_rate: 5.0e-4  # Default from run_lightning.py
          patience: 5         # From original TGTSF bash script (scripts/Germany_Renewable_Power_Grid/TGTSF.sh)
          # LR schedule is type3 via the template (constant 3 epochs, then 0.9 decay)
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          use_tensor_cache: false  # Disable tensor cache
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["tgtsf", "germany_renewable"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/tgtsf/germany_renewable"

# Experiment Suite: TGTSF on Time MMD and TTC datasets
# Description: Train TGTSF model on all Time MMD (Liu et al., 2024b) and TTC (Kim et al., 2024) datasets
# Usage: python -m cli.suite run configs/experiment_suites/tgtsf/time_mmd_ttc.yaml
# Note: Input/output lens match itransformer time_mmd_ttc config (same context/horizon for fair comparison)
#       Hyperparameters use judgment since original TGTSF paper only covers Fidel-TS datasets
#       Uses batch_size=16 for time_mmd/ttc datasets (smaller than Fidel-TS)

suite:
  name: "tgtsf_time_mmd_ttc"
  description: "Train TGTSF model on all Time MMD and TTC datasets"
  tags: ["tgtsf", "multimodal", "pytorch", "time_mmd", "ttc"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/tgtsf/time_mmd_ttc"
    
  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================
    
    # Agriculture: context=24, prediction=6
    - name: "tgtsf_timemmd_agriculture"
      description: "TGTSF on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        data:
          name: "time_mmd_agriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        training:
          input_len: 24       # Match itransformer time_mmd_ttc config
          output_len: 6       # Match itransformer time_mmd_ttc config
          batch_size: 16      # Smaller batch size for time_mmd datasets (judgment-based)
          learning_rate: 5.0e-4  # Default from run_lightning.py
          patience: 5         # Same as most Fidel-TS datasets
          epochs: 50          # Same as Fidel-TS datasets
          # LR schedule is type3 via the template (constant 3 epochs, then 0.9 decay)
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
          use_tensor_cache: false  # Disable tensor cache
        wandb:
          tags: ["tgtsf", "time_mmd_agriculture"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/tgtsf/time_mmd_ttc"
    

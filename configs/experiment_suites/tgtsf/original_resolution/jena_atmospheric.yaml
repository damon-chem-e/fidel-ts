# Experiment Suite: TGTSF on Jena_Atmospheric_Physics
# Description: Train TGTSF on Jena_Atmospheric_Physics with same context/horizon as itransformer
# Usage: python -m cli.suite run configs/experiment_suites/tgtsf/original_resolution/jena_atmospheric.yaml
# Note: Uses original paper's hetero stride (aligned with model stride, hetero_stride=3)

suite:
  name: "tgtsf_jena_atmospheric"
  description: "Train TGTSF model on Jena_Atmospheric_Physics dataset with 15-day context, 1-week prediction"
  tags: ["tgtsf", "multimodal", "pytorch", "fidel-ts", "jena_atmospheric"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/tgtsf/jena_atmospheric"
    
  # Experiments in this suite
  experiments:
    - name: "tgtsf_jena_atmospheric"
      description: "TGTSF on Jena_Atmospheric_Physics with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        model_config_overrides:
          input_text_dim: 768  # Match the BERT embedding dimension from the cache
        data:
          name: "Jena_Atmospheric_Physics"
          config_path: "data_configs/Jena_Atmospheric_Physics/fullJAP_hetero_TGTSF_H.yaml"
        training:
          epochs: 50
          # Match itransformer Jena_Atmospheric input/output lengths
          input_len: 360      # 15 days at hourly intervals
          output_len: 168     # 1 week at hourly intervals (second smallest horizon)
          batch_size: 256     # From original TGTSF bash script (scripts/Jena_Atmospheric_Physics/TGTSF.sh)
          learning_rate: 5.0e-4  # Default from run_lightning.py
          patience: 5         # From original TGTSF bash script (scripts/Jena_Atmospheric_Physics/TGTSF.sh)
          # LR schedule is type3 via the template (constant 3 epochs, then 0.9 decay)
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          use_tensor_cache: true  # Enable tensor cache
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["tgtsf", "jena_atmospheric"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/tgtsf/jena_atmospheric"

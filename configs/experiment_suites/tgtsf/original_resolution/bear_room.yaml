# Experiment Suite: TGTSF on Bear_room
# Description: Train TGTSF on Bear_room with same context/horizon as itransformer
# Usage: python -m cli.suite run configs/experiment_suites/tgtsf/original_resolution/bear_room.yaml
# Note: Bear_room uses 5-min sampling (not downsampled per paper)
#       Input: 288 samples = 1 day, Output: 144 samples = 12 hours (second smallest prediction)
#       Uses original paper's hetero stride (aligned with model stride, hetero_stride=3)

suite:
  name: "tgtsf_bear_room"
  description: "Train TGTSF model on Bear_room dataset with 1-day context, 12-hour prediction"
  tags: ["tgtsf", "multimodal", "pytorch", "fidel-ts", "bear_room"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/tgtsf/bear_room"
    
  # Experiments in this suite
  experiments:
    - name: "tgtsf_bear_room"
      description: "TGTSF on Bear_room with 1-day context, 12-hour prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF/TGTSF-Bear.yaml"
        model_config_overrides:
          input_text_dim: 768  # Match the BERT embedding dimension from the cache
        data:
          name: "Bear_room"
          config_path: "data_configs/Bear_room/fullBear_hetero_TGTSF.yaml"
        training:
          epochs: 50
          # Match itransformer Bear_room input/output lengths
          input_len: 288      # 1 day at 5-min intervals
          output_len: 144     # 12 hours at 5-min intervals (second smallest horizon)
          batch_size: 128     # From original TGTSF bash script (scripts/Bear_room/TGTSF.sh)
          learning_rate: 5.0e-4  # Default from run_lightning.py
          patience: 10        # From original TGTSF bash script (scripts/Bear_room/TGTSF.sh)
          # LR schedule is type3 via the template (constant 3 epochs, then 0.9 decay)
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          use_tensor_cache: true  # Enable tensor cache
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["tgtsf", "bear_room"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/tgtsf/bear_room"

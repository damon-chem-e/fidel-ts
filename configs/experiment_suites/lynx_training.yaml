# Experiment Suite: lynx Training
# Description: Train lynx models using pretrained iTransformer checkpoints as frozen base models
# Usage: 
#   1. First run: python -m cli.suite run configs/experiment_suites/itransformer_pretraining.yaml
#   2. Then run: python -m cli.suite run configs/experiment_suites/lynx_training.yaml

suite:
  name: "lynx_training"
  description: "Train lynx models using pretrained iTransformer checkpoints as frozen base models"
  tags: ["lynx", "residual", "lightning", "heterogeneous"]
  
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_training"
  
  experiments:
    # NYC Traffic Speed
    - name: "lynx_nyc_traffic_speed_24"
      description: "lynx on NYC Traffic Speed with 24-step prediction"
      enabled: true
      template: "configs/templates/lightning_training.yaml"
      overrides:
        model:
          name: "lynx"
          config_path: "model_configs/general/lynx.yaml"
        model_config_overrides:
          pretrained_model_path: "outputs/suites/itransformer_pretraining/itransformer_nyc_traffic_speed_24/checkpoint.ckpt"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution text embeddings (recommended)
          input_len: 360
          output_len: 24
          batch_size: 256
          patience: 5
          epochs: 50
        experiment:
          type: "lightning"
          output_dir: "outputs/suites/lynx_training"
          
    - name: "lynx_nyc_traffic_speed_168"
      description: "lynx on NYC Traffic Speed with 168-step prediction"

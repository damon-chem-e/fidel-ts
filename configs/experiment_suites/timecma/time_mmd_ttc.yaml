# Experiment Suite: TimeCMA on Time MMD and TTC datasets
# Description: Train TimeCMA model on all Time MMD (Liu et al., 2024b) and TTC (Kim et al., 2024) datasets
# Usage: python -m cli.suite run configs/experiment_suites/timecma/time_mmd_ttc.yaml
# Note: Input/output lens follow Table 4 from the original papers:
#       - Time MMD datasets use 7:1:2 train/val/test ratio splits
#       - TTC datasets use 7:1:2 train/val/test ratio splits
#
# IMPORTANT: This suite requires pre-computed LLM embeddings!
# Each experiment in this suite has an llm_embedding section that specifies
# the LLM model and settings for embedding generation.

suite:
  name: "timecma_time_mmd_ttc"
  description: "Train TimeCMA model on all Time MMD and TTC datasets"
  tags: ["timecma", "multimodal", "cross-modal", "llm", "pytorch", "time_mmd", "ttc", "aaai2025"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/timecma/time_mmd_ttc"
    
  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================
    
    # Agriculture: context=24, prediction=6
    - name: "timecma_gpt2_timemmd_agriculture"
      description: "TimeCMA with GPT-2 embeddings on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_algriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution (TimeCMA uses per-sample embeddings, so this is ignored but safe)
          input_len: 24       # Context length from Table 4
          output_len: 6       # Prediction length from Table 4
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: false  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
          use_tensor_cache: false  # Disable tensor cache
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: true
          tags: ["timecma", "time_mmd_algriculture"]
        # LLM embedding configuration for TimeCMA
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          enc_in: 1           # Number of input channels
          channel: 32         # Hidden dimension
          d_ff: 32            # Feed-forward dimension
          e_layers: 1         # Encoder layers
          d_layers: 1         # Decoder layers
          n_heads: 8          # Attention heads
          dropout: 0.2
          d_llm: 768          # GPT-2 base embedding dimension
          seq_len: 24
          pred_len: 6
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma/time_mmd_ttc"
    

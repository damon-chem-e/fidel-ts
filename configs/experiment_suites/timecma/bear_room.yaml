# Experiment Suite: TimeCMA on Bear_room
# Description: Train TimeCMA model on Bear_room dataset
# Usage: python -m cli.suite run configs/experiment_suites/timecma/bear_room.yaml
# Note: Bear_room uses 5-min sampling (not downsampled per paper)
#       Input: 288 samples = 1 day, Output: 144 samples = 12 hours (second smallest prediction)
#       Split points: {Sep. 1, 2020, Oct. 1, 2020}
#
# IMPORTANT: This suite requires pre-computed LLM embeddings!
# Each experiment in this suite has an llm_embedding section that specifies
# the LLM model and settings for embedding generation.

suite:
  name: "timecma_bear_room"
  description: "Train TimeCMA model on Bear_room dataset with 1-day context, 12-hour prediction"
  tags: ["timecma", "multimodal", "cross-modal", "llm", "pytorch", "fidel-ts", "bear_room", "aaai2025"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/timecma/bear_room"
    
  # Experiments in this suite
  experiments:
    - name: "timecma_gpt2_bear_room"
      description: "TimeCMA with GPT-2 embeddings on Bear_room with 1-day context, 12-hour prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "fidel_Bear_room:fullBear_hetero_TGTSF"
          config_path: "data_configs/Bear_room/fullBear_hetero_TGTSF.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution (TimeCMA uses per-sample embeddings, so this is ignored but safe)
          input_len: 288      # 1 day at 5-min intervals (288 = 24h * 12)
          output_len: 144     # 12 hours at 5-min intervals (second smallest: {12, 144, 288, 576})
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: true
          tags: ["timecma", "bear_room"]
        # LLM embedding configuration for TimeCMA
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          # Bear_room channel configuration
          enc_in: 1           # Number of input channels
          # TimeCMA architecture parameters
          channel: 32         # Hidden dimension
          d_ff: 32            # Feed-forward dimension
          e_layers: 1         # Encoder layers
          d_layers: 1         # Decoder layers
          n_heads: 8          # Attention heads
          dropout: 0.2
          # GPT-2 base embedding dimension
          d_llm: 768
          # Sequence configuration
          seq_len: 288
          pred_len: 144
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma/bear_room"

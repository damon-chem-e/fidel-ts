# Experiment Suite: lynx_film_raw TTC Medical Sweep
# Description: Hyperparameter sweep for TTC Medical dataset with architecture and training parameters
# Usage: Used with wandb sweep for testing architecture (e_layers, d_model, n_heads) and training (LR, batch_size) parameters
# NOTE: Sweeps around parameter values: LR=0.00025, batch_size=8, d_model=512, e_layers=2, n_heads=8

suite:
  name: "lynx_film_raw_ttc_sweep"
  description: "Hyperparameter sweep: lynx_film_raw on TTC Medical (architecture + training params)"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "ttc_sweep", "film", "ttc_medical"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film_raw_ttc_sweep"
    
  # Experiments in this suite
  experiments:
    # TTC Medical - hyperparameter sweep with architecture parameters
    - name: "lynx_film_raw_ttc_medical_sweep"
      description: "lynx_film_raw on TTC Medical (HYPERPARAMETER SWEEP - architecture + training params)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        model_config_overrides:
          input_text_dim: 768  # BERT embedding dimension (projects 768 -> text_dim=256)
          # e_layers, d_model, n_heads will be overridden by sweep
          n_heads: 8
        data:
          name: "ttc_medical"
          config_path: "data_configs/ttc/medical/config.yaml"
        training:
          input_len: 7        # Context length from Table 4
          output_len: 7       # Prediction length from Table 4
          batch_size: 8       # Will be overridden by sweep (default in middle of range)
          learning_rate: 0.00025  # Will be overridden by sweep (default in middle of good range)
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
        wandb:
          tags: ["lynx_film_raw", "ttc_medical", "sweep"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw_ttc_sweep"

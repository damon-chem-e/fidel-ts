# Experiment Suite: iTransformer on Jena_Atmospheric_Physics
# Description: Train iTransformer on Jena_Atmospheric_Physics with same context/horizon as lynx_film_raw
# Usage: python -m cli.suite run configs/experiment_suites/itransformer/jena_atmospheric.yaml

suite:
  name: "itransformer_jena_atmospheric"
  description: "Train iTransformer model on Jena_Atmospheric_Physics dataset with 15-day context, 1-week prediction"
  tags: ["itransformer", "pytorch", "fidel-ts", "jena_atmospheric"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/itransformer/jena_atmospheric"
    
  # Experiments in this suite
  experiments:
    - name: "itransformer_jena_atmospheric"
      description: "iTransformer on Jena_Atmospheric_Physics with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "iTransformer"
          config_path: "model_configs/general/iTransformer.yaml"
        data:
          name: "Jena_Atmospheric_Physics"
          # Match original iTransformer bash script data config
          config_path: "data_configs/Jena_Atmospheric_Physics/fullJAP_H.yaml"
        training:
          epochs: 30
          # Match lynx_film_raw Jena_Atmospheric_Physics input/output lengths
          input_len: 360      # 15 days at hourly intervals
          output_len: 168     # 1 week at hourly intervals (second smallest horizon)
          batch_size: 512     # From original iTransformer bash script
          learning_rate: 5.0e-4  # From original fork defaults (run_lightning.py)
          # LR schedule is type3 via the template (constant 3 epochs, then 0.9 decay)
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["itransformer", "jena_atmospheric"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/itransformer/jena_atmospheric"


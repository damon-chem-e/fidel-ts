# Experiment Suite: iTransformer on Time MMD and TTC datasets
# Description: Train iTransformer model on all Time MMD (Liu et al., 2024b) and TTC (Kim et al., 2024) datasets
# Usage: python -m cli.suite run configs/experiment_suites/itransformer/time_mmd_ttc.yaml
# Note: Input/output lens match lynx_film_raw time_mmd_ttc config (same context/horizon for fair comparison)
#       Uses same hyperparameters as other iTransformer configs: learning_rate=5.0e-4, lradj=type3

suite:
  name: "itransformer_time_mmd_ttc"
  description: "Train iTransformer model on all Time MMD and TTC datasets"
  tags: ["itransformer", "pytorch", "time_mmd", "ttc"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/itransformer/time_mmd_ttc"
    
  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================
    
    # Agriculture: context=24, prediction=6
    - name: "itransformer_timemmd_agriculture"
      description: "iTransformer on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "iTransformer"
          config_path: "model_configs/general/iTransformer.yaml"
        data:
          name: "time_mmd_agriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        training:
          input_len: 24       # Match lynx_film_raw time_mmd_ttc config
          output_len: 6       # Match lynx_film_raw time_mmd_ttc config
          batch_size: 32      # Reasonable batch size for time_mmd datasets
          learning_rate: 5.0e-4  # From original fork defaults (run_lightning.py)
          # LR schedule is type3 via the template (constant 3 epochs, then 0.9 decay)
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["itransformer", "time_mmd_agriculture"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/itransformer/time_mmd_ttc"
    

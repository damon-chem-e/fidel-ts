# Experiment Suite: film Training Test
# Description: Test run for film (lynx_film) training on a single dataset and prediction horizon
# Usage: 
#   1. First run: python -m cli.suite run configs/experiment_suites/itransformer_pretraining_test.yaml
#   2. Then run: python -m cli.suite run configs/experiment_suites/film_test.yaml
# This is a test configuration before running the full film training suite
# NOTE: Currently contains 1 experiment. May extend to 2-3 experiments later for more thorough testing.

suite:
  name: "film_test"
  description: "Test run: Train film (lynx_film) model using pretrained iTransformer checkpoint on NYC Traffic Speed with 24-step prediction using PyTorch"
  tags: ["film", "lynx_film", "residual", "pytorch", "test"]
  
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/film_test"
  
  experiments:
    # NYC Traffic Speed - 24-step prediction (test run)
    - name: "film_nyc_traffic_speed_24"
      description: "film (lynx_film) on NYC Traffic Speed with 24-step prediction (TEST)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film"
          config_path: "model_configs/general/lynx_film.yaml"
        model_config:
          pretrained_model_path: "/nfs/sloanlab007/projects/chimera_proj/fidel-ts/output/itransformer_pretraining_test_20251205_163130/20251205-163130_5ef325ab0162/checkpoints/best_checkpoint.pth"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 360
          output_len: 24
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
          track_per_sample: false  # Disable per-sample tracking for initial training
          evaluate_test_during_training: false  # Only evaluate test at final epoch
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/film_test"


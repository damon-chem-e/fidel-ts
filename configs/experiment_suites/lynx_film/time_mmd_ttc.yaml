# Experiment Suite: lynx_film on Time MMD and TTC datasets
# Description: Train lynx_film model on all Time MMD (Liu et al., 2024b) and TTC (Kim et al., 2024) datasets using pretrained iTransformer checkpoints
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film/time_mmd_ttc.yaml
# Note: Input/output lens follow Table 4 from the original papers:
#       - Time MMD datasets use 7:1:2 train/val/test ratio splits
#       - TTC datasets use 7:1:2 train/val/test ratio splits
# NOTE: pretrained_model_path contains placeholders that must be filled in before running
#       Note that iTransformer pretrained models may not exist for all Time MMD/TTC datasets

suite:
  name: "lynx_film_time_mmd_ttc"
  description: "Train lynx_film model on all Time MMD and TTC datasets using pretrained iTransformer checkpoints"
  tags: ["lynx_film", "multimodal", "pytorch", "time_mmd", "ttc", "film"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/lynx_film/time_mmd_ttc"
    
  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================
    
    # Agriculture: context=24, prediction=6
    - name: "lynx_film_timemmd_agriculture"
      description: "lynx_film on Time MMD Agriculture dataset using pretrained iTransformer"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film"
          config_path: "model_configs/general/lynx_film.yaml"
        model_config_overrides:
          # Model shape and hparams must match pretrained iTransformer from experiment_suites/itransformer
          d_model: 128      # Match iTransformer d_model (changed from 1024 to match pretrained model)
          d_ff: 128         # Match iTransformer d_ff
          e_layers: 2       # Match iTransformer e_layers
          n_heads: 8        # Match iTransformer n_heads
          input_text_dim: 768  # Keep time_mmd specific override
          # Pretrained iTransformer checkpoint from itransformer_time_mmd_ttc suite
          pretrained_model_path: "output/itransformer_time_mmd_ttc_20260113_111324/20260113-111324_7d386ba4708c/checkpoints/best_checkpoint.pth"
        data:
          name: "time_mmd_agriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          input_len: 24       # Context length from Table 4
          output_len: 6       # Prediction length from Table 4
          batch_size: 12
          learning_rate: 0.00022
          patience: 2
          epochs: 3
          track_per_sample: false
          evaluate_test_during_training: true
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["lynx_film", "time_mmd_agriculture"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film/time_mmd_ttc"
    

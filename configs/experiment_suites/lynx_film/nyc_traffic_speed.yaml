# Experiment Suite: lynx_film on NYC_traffic_speed
# Description: Train lynx_film model on NYC_traffic_speed dataset using pretrained iTransformer checkpoint
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film/nyc_traffic_speed.yaml
# Note: NYC_traffic_speed uses hourly sampling (downsampled to -h)
#       Input: 360 samples = 15 days (half month), Output: 168 samples = 1 week (second smallest)
#       Split points: {Jan. 1, 2021, Jan. 1, 2022}
# NOTE: pretrained_model_path contains a placeholder that must be filled in before running

suite:
  name: "lynx_film_nyc_traffic_speed"
  description: "Train lynx_film model on NYC_traffic_speed dataset with 15-day context, 1-week prediction using pretrained iTransformer"
  tags: ["lynx_film", "multimodal", "pytorch", "fidel-ts", "nyc_traffic_speed", "film"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film/nyc_traffic_speed"
    
  # Experiments in this suite
  experiments:
    - name: "lynx_film_nyc_traffic_speed"
      description: "lynx_film on NYC_traffic_speed with 15-day context, 1-week prediction using pretrained iTransformer"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film"
          config_path: "model_configs/general/lynx_film.yaml"
        model_config_overrides:
          # Model shape and hparams must match pretrained iTransformer from experiment_suites/itransformer
          d_model: 128      # Match iTransformer d_model
          d_ff: 128         # Match iTransformer d_ff
          e_layers: 2       # Match iTransformer e_layers
          n_heads: 8        # Match iTransformer n_heads
          input_text_dim: 768  # Text embedding dimension for FiLM modulation
          # TODO: Fill in pretrained_model_path with actual checkpoint path from itransformer pretraining
          # Expected path format: outputs/suites/itransformer/nyc_traffic_speed/{experiment_id}/checkpoints/best_checkpoint.pth
          pretrained_model_path: "PLACEHOLDER_FILL_IN_LATER_outputs/suites/itransformer/nyc_traffic_speed/PLACEHOLDER_EXPERIMENT_ID/checkpoints/best_checkpoint.pth"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution text embeddings (recommended)
          input_len: 360      # 15 days at hourly intervals (half month)
          output_len: 168     # 1 week at hourly intervals (second smallest: {24, 168, 336, 720})
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["lynx_film", "nyc_traffic_speed"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film/nyc_traffic_speed"

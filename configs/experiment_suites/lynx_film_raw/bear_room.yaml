# Experiment Suite: lynx_film_raw on Bear_room
# Description: Train lynx_film_raw model on Bear_room dataset
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film_raw/bear_room.yaml
# Note: Bear_room uses 5-min sampling (not downsampled per paper)
#       Input: 288 samples = 1 day, Output: 144 samples = 12 hours (second smallest prediction)
#       Split points: {Sep. 1, 2020, Oct. 1, 2020}

suite:
  name: "lynx_film_raw_bear_room"
  description: "Train lynx_film_raw model on Bear_room dataset with 1-day context, 12-hour prediction"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "fidel-ts", "bear_room", "film"]
  resume_suite_id: "lynx_film_raw_bear_room_20260105_124243"
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film_raw/bear_room"
    
  # Experiments in this suite
  experiments:
    - name: "lynx_film_raw_bear_room"
      description: "lynx_film_raw on Bear_room with 1-day context, 12-hour prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        model_config_overrides:
          input_text_dim: 768  # Text embedding dimension for FiLM modulation
        data:
          name: "Bear_room"
          config_path: "data_configs/Bear_room/fullBear_hetero_TGTSF.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution text embeddings (recommended)
          input_len: 288      # 1 day at 5-min intervals (288 = 24h * 12)
          output_len: 144     # 12 hours at 5-min intervals (second smallest: {12, 144, 288, 576})
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["lynx_film_raw", "bear_room"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw/bear_room"
          resume_experiment_id: "20260105-124243_4a8a0c764258"
# Experiment Suite: lynx_film_raw on Canada_photovoltaics_plants
# Description: Train lynx_film_raw model on Canada_photovoltaics_plants dataset
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film_raw/canada_photovoltaics.yaml
# Note: Canada_photovoltaics_plants uses hourly sampling (downsampled to -h)
#       Input: 360 samples = 15 days (half month), Output: 168 samples = 1 week (second smallest)
#       Split points: {Jan. 1, 2021, Jan. 1, 2022}

suite:
  name: "lynx_film_raw_canada_photovoltaics"
  description: "Train lynx_film_raw model on Canada_photovoltaics_plants dataset with 15-day context, 1-week prediction"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "fidel-ts", "canada_photovoltaics", "film"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film_raw/canada_photovoltaics"
    
  # Experiments in this suite
  experiments:
    - name: "lynx_film_raw_canada_photovoltaics"
      description: "lynx_film_raw on Canada_photovoltaics_plants with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        data:
          name: "Canada_photovoltaics_plants"
          config_path: "data_configs/Canada_photovoltaics_plants/fullCPP_hetero_TGTSF.yaml"
        training:
          input_len: 360      # 15 days at hourly intervals (half month)
          output_len: 168     # 1 week at hourly intervals (second smallest: {24, 168, 336, 720})
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
        wandb:
          tags: ["lynx_film_raw", "canada_photovoltaics"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw/canada_photovoltaics"

# Experiment Suite: lynx_film_raw on Jena_Atmospheric_Physics
# Description: Train lynx_film_raw model on Jena_Atmospheric_Physics dataset
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film_raw/jena_atmospheric.yaml
# Note: Jena_Atmospheric_Physics uses hourly sampling (downsampled to -h)
#       Input: 360 samples = 15 days (half month), Output: 168 samples = 1 week (second smallest)
#       Split points: {Jan. 1, 2021, Jan. 1, 2022}

suite:
  name: "lynx_film_raw_jena_atmospheric"
  description: "Train lynx_film_raw model on Jena_Atmospheric_Physics dataset with 15-day context, 1-week prediction"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "fidel-ts", "jena_atmospheric", "film"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film_raw/jena_atmospheric"
    
  # Experiments in this suite
  experiments:
    - name: "lynx_film_raw_jena_atmospheric"
      description: "lynx_film_raw on Jena_Atmospheric_Physics with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        data:
          name: "Jena_Atmospheric_Physics"
          config_path: "data_configs/Jena_Atmospheric_Physics/fullJAP_hetero_TGTSF_H.yaml"
        training:
          input_len: 360      # 15 days at hourly intervals (half month)
          output_len: 168     # 1 week at hourly intervals (second smallest: {24, 168, 336, 720})
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["lynx_film_raw", "jena_atmospheric"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw/jena_atmospheric"

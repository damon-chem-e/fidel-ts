# Experiment Suite: lynx_film_raw on Time MMD and TTC datasets
# Description: Train lynx_film_raw model on all Time MMD (Liu et al., 2024b) and TTC (Kim et al., 2024) datasets
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film_raw/time_mmd_ttc.yaml
# Note: Input/output lens follow Table 4 from the original papers:
#       - Time MMD datasets use 7:1:2 train/val/test ratio splits
#       - TTC datasets use 7:1:2 train/val/test ratio splits

suite:
  name: "lynx_film_raw_time_mmd_ttc"
  description: "Train lynx_film_raw model on all Time MMD and TTC datasets"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "time_mmd", "ttc", "film"]
  resume_suite_id: "lynx_film_raw_time_mmd_ttc_20260112_165034"
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/lynx_film_raw/time_mmd_ttc"
    
  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================
    
    # Agriculture: context=24, prediction=6
    - name: "lynx_film_raw_timemmd_agriculture"
      description: "lynx_film_raw on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        model_config_overrides:
          d_model: 1024
          e_layers: 2
          n_heads: 8
          input_text_dim: 768
        data:
          name: "time_mmd_agriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          input_len: 24       # Context length from Table 4
          output_len: 6       # Prediction length from Table 4
          batch_size: 12
          learning_rate: 0.00022
          patience: 2
          epochs: 3
          track_per_sample: false
          evaluate_test_during_training: true
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
        wandb:
          tags: ["lynx_film_raw", "time_mmd_agriculture"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw/time_mmd_ttc"
          resume_experiment_id: "20260112-165034_a80e67e1db27"
    

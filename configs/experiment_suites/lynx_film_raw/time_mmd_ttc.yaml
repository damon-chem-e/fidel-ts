          config_path: "data_configs/time_mmd/Climate/config.yaml"
        training:
          input_len: 24       # Context length from Table 4
          output_len: 6       # Prediction length from Table 4
          batch_size: 8
          learning_rate: 0.00025
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
        wandb:
          tags: ["lynx_film_raw", "time_mmd_climate"]
        experiment:

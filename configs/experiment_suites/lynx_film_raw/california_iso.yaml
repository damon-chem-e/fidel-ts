# Experiment Suite: lynx_film_raw on California_ISO
# Description: Train lynx_film_raw model on California_ISO dataset
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film_raw/california_iso.yaml
# Note: California_ISO uses hourly sampling (downsampled to -h)
#       Input: 360 samples = 15 days (half month), Output: 168 samples = 1 week (second smallest)
#       Split points: {Jan. 1, 2021, Jan. 1, 2022}

suite:
  name: "lynx_film_raw_california_iso"
  description: "Train lynx_film_raw model on California_ISO dataset with 15-day context, 1-week prediction"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "fidel-ts", "california_iso", "film"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film_raw/california_iso"
    
  # Experiments in this suite
  experiments:
    - name: "lynx_film_raw_california_iso"
      description: "lynx_film_raw on California_ISO with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        data:
          name: "California_ISO"
          config_path: "data_configs/California_ISO/fullCAISO_hetero_TGTSF_H.yaml"
        training:
          input_len: 360      # 15 days at hourly intervals (half month)
          output_len: 168     # 1 week at hourly intervals (second smallest: {24, 168, 336, 720})
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw/california_iso"

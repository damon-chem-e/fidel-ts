      description: "iTransformer on NYC Traffic Speed with 336-step prediction"
      enabled: true
      template: "configs/templates/lightning_training.yaml"
      overrides:
        model:
          name: "iTransformer"
          config_path: "model_configs/general/iTransformer.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_H.yaml"
        training:
          input_len: 360
          output_len: 336
          batch_size: 512
        experiment:
          type: "lightning"
          output_dir: "outputs/suites/itransformer_pretraining"
          
    - name: "itransformer_nyc_traffic_speed_720"

        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_H.yaml"
        training:
          input_len: 360
          output_len: 168
          batch_size: 512
        experiment:
          type: "lightning"
          output_dir: "outputs/suites/itransformer_pretraining"
          

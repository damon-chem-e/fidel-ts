# Experiment Suite: iTransformer Pretraining
# Description: Train iTransformer models on all datasets and save checkpoints for use as frozen base models in lynx
# Usage: python -m cli.suite run configs/experiment_suites/itransformer_pretraining.yaml

suite:
  name: "itransformer_pretraining"
  description: "Train iTransformer models on all datasets with multiple forecast horizons for use as frozen base models in lynx"
  tags: ["itransformer", "pretraining", "lightning", "homogeneous"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/itransformer_pretraining"
    
  # Experiments in this suite
  experiments:
    # NYC Traffic Speed
    - name: "itransformer_nyc_traffic_speed_24"
      description: "iTransformer on NYC Traffic Speed with 24-step prediction"
      enabled: true
      template: "configs/templates/lightning_training.yaml"
      overrides:
        model:
          name: "iTransformer"
          config_path: "model_configs/general/iTransformer.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_H.yaml"
        training:
          input_len: 360
          output_len: 24
          batch_size: 512
        experiment:
          type: "lightning"
          output_dir: "outputs/suites/itransformer_pretraining"
          
    - name: "itransformer_nyc_traffic_speed_168"
      description: "iTransformer on NYC Traffic Speed with 168-step prediction"

# Experiment Suite: TimeCMA Test Suite
# Description: Test TimeCMA (Cross-Modality Alignment) on Time-MMD, Fidel-TS, and TTC datasets
# Usage: python -m cli.suite run configs/experiment_suites/timecma_test.yaml
#
# IMPORTANT: This suite requires pre-computed LLM embeddings!
# Each experiment in this suite has an llm_embedding section that specifies
# the LLM model and settings for embedding generation.
#
# To generate embeddings for a specific experiment:
#   python -m cli.inference generate <experiment_config.yaml>
#
# The suite runner can also generate embeddings automatically if configured.
#
# Reference:
#   TimeCMA: Towards LLM-Empowered Multivariate Time Series Forecasting
#   via Cross-Modality Alignment (AAAI 2025)

suite:
  name: "timecma_test"
  description: "Test TimeCMA model on Time-MMD, Fidel-TS, and TTC datasets (1 epoch each, requires pre-computed embeddings)"
  tags: ["timecma", "multimodal", "cross-modal", "llm", "test", "aaai2025", "fidel-ts", "ttc"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/timecma_test"
    
  # Experiments in this suite
  experiments:
    # =========================================================================
    # TimeCMA on Time-MMD Traffic (GPT-2 embeddings)
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_traffic"
      description: "TimeCMA with GPT-2 embeddings on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        # LLM embedding configuration for TimeCMA
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          # Channel configuration (Time-MMD Traffic has 1 target variable)
          enc_in: 1
          # TimeCMA architecture parameters
          channel: 32         # Hidden dimension
          d_ff: 32            # Feed-forward dimension
          e_layers: 1         # Encoder layers
          d_layers: 1         # Decoder layers
          n_heads: 8          # Attention heads
          dropout: 0.2
          # GPT-2 base embedding dimension
          d_llm: 768
          # Sequence configuration
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA on Time-MMD Energy (GPT-2 embeddings)
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_energy"
      description: "TimeCMA with GPT-2 embeddings on Time-MMD Energy (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_energy"
          config_path: "data_configs/time_mmd/Energy/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          enc_in: 1
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA with different prediction horizons
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_traffic_pred96"
      description: "TimeCMA on Traffic with longer prediction horizon (pred_len=96)"
      enabled: false  # Disabled: Traffic dataset too small for seq_len=96 + pred_len=96
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        training:
          input_len: 96
          output_len: 96
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          enc_in: 1
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 96
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA with larger model (closer to paper config)
    # =========================================================================
    - name: "timecma_large_time_mmd_traffic"
      description: "TimeCMA with larger model dimensions on Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 16  # Smaller batch for larger model
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          enc_in: 1
          # Larger model dimensions
          channel: 64
          d_ff: 128
          e_layers: 2
          d_layers: 2
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA on Climate dataset
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_climate"
      description: "TimeCMA with GPT-2 embeddings on Time-MMD Climate (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_climate"
          config_path: "data_configs/time_mmd/Climate/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          enc_in: 1
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"

    # =========================================================================
    # TimeCMA on Fidel-TS NYC Traffic Speed Dataset (GPT-2 embeddings)
    # This is a LARGE dataset - uses memory-efficient chunked processing
    # =========================================================================
    - name: "timecma_gpt2_fidel_nyc_traffic"
      description: "TimeCMA with GPT-2 embeddings on Fidel-TS NYC Traffic Speed (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "fidel_NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_H.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
          # Memory-efficient mode for large Fidel-TS dataset (~30M observations)
          # Use large chunk_size to maximize GPU utilization
          memory_efficient: true
          chunk_size: 5000
        model_config_overrides:
          # NYC Traffic Speed has 1 target (SPEED)
          enc_in: 1
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"

    # =========================================================================
    # TimeCMA on TTC Climate Dataset (GPT-2 embeddings)
    # =========================================================================
    - name: "timecma_gpt2_ttc_climate"
      description: "TimeCMA with GPT-2 embeddings on TTC Climate (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "ttc_climate"
          config_path: "data_configs/ttc/climate/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        llm_embedding:
          model_name: "gpt2"
          batch_size: 64
          cache_dir: "./LLM_cache/"
          prompt_template: "timecma_v1"
        model_config_overrides:
          # TTC Climate has 4 features (temp, precip, humidity, windspeed)
          enc_in: 4
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"


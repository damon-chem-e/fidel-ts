# Experiment Suite: TimeCMA Test Suite
# Description: Test TimeCMA (Cross-Modality Alignment) on Time-MMD datasets
# Usage: python -m cli.suite run configs/experiment_suites/timecma_test.yaml
#
# IMPORTANT: This suite requires pre-computed LLM embeddings!
# Generate embeddings before running this suite:
#
#   # For GPT-2 (fast, for testing):
#   python -m cli.inference generate time_mmd_traffic model_configs/llm_embedding/gpt2.yaml
#   python -m cli.inference generate time_mmd_energy model_configs/llm_embedding/gpt2.yaml
#
#   # For Qwen 72B (production quality, requires H200):
#   python -m cli.inference generate time_mmd_traffic model_configs/llm_embedding/default.yaml
#   python -m cli.inference generate time_mmd_energy model_configs/llm_embedding/default.yaml
#
# Reference:
#   TimeCMA: Towards LLM-Empowered Multivariate Time Series Forecasting
#   via Cross-Modality Alignment (AAAI 2025)

suite:
  name: "timecma_test"
  description: "Test TimeCMA model on Time-MMD datasets (1 epoch each, requires pre-computed embeddings)"
  tags: ["timecma", "multimodal", "cross-modal", "llm", "test", "aaai2025"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/timecma_test"
    
  # Experiments in this suite
  experiments:
    # =========================================================================
    # TimeCMA on Time-MMD Traffic (GPT-2 embeddings)
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_traffic"
      description: "TimeCMA with GPT-2 embeddings on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        model_config_overrides:
          # Channel configuration (Time-MMD Traffic has 1 target variable)
          enc_in: 1
          # TimeCMA architecture parameters
          channel: 32         # Hidden dimension
          d_ff: 32            # Feed-forward dimension
          e_layers: 1         # Encoder layers
          d_layers: 1         # Decoder layers
          n_heads: 8          # Attention heads
          dropout: 0.2
          # GPT-2 base embedding dimension
          d_llm: 768
          # Sequence configuration
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA on Time-MMD Energy (GPT-2 embeddings)
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_energy"
      description: "TimeCMA with GPT-2 embeddings on Time-MMD Energy (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_energy"
          config_path: "data_configs/time_mmd/Energy/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        model_config_overrides:
          enc_in: 1
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA with different prediction horizons
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_traffic_pred96"
      description: "TimeCMA on Traffic with longer prediction horizon (pred_len=96)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        training:
          input_len: 96
          output_len: 96
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        model_config_overrides:
          enc_in: 1
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 96
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA with larger model (closer to paper config)
    # =========================================================================
    - name: "timecma_large_time_mmd_traffic"
      description: "TimeCMA with larger model dimensions on Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 16  # Smaller batch for larger model
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        model_config_overrides:
          enc_in: 1
          # Larger model dimensions
          channel: 64
          d_ff: 128
          e_layers: 2
          d_layers: 2
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"
    
    # =========================================================================
    # TimeCMA on Climate dataset
    # =========================================================================
    - name: "timecma_gpt2_time_mmd_climate"
      description: "TimeCMA with GPT-2 embeddings on Time-MMD Climate (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeCMA"
          config_path: "model_configs/general/TimeCMA.yaml"
        data:
          name: "time_mmd_climate"
          config_path: "data_configs/time_mmd/Climate/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: false
        model_config_overrides:
          enc_in: 1
          channel: 32
          d_ff: 32
          e_layers: 1
          d_layers: 1
          n_heads: 8
          dropout: 0.2
          d_llm: 768
          seq_len: 96
          pred_len: 24
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timecma_test"



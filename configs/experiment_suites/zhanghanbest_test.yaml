# Experiment Suite: ZhangHanBest Model Test
# Description: Test ZhangHanBest with ALL 8 supported unimodal encoders for 1 epoch each
# Supported Models: PatchTST, DLinear, iTransformer, FITS, FEDformer, Informer, Sundial, TimeMoE
# Usage: python -m cli.suite run configs/experiment_suites/zhanghanbest_test.yaml
# Purpose: Verify that ZhangHanBest works correctly with each unimodal encoder type

suite:
  name: "zhanghanbest_test"
  description: "Test ZhangHanBest model with ALL 8 supported unimodal encoders - 1 epoch each"
  tags: ["zhanghanbest", "multimodal", "pytorch", "test", "tgtsf"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/zhanghanbest_test"
  
  # Experiments in this suite
  experiments:
    # ZhangHanBest with PatchTST (default encoder)
    - name: "zhanghanbest_patchtst_nyc_traffic_speed"
      description: "ZhangHanBest with PatchTST encoder on NYC Traffic Speed (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          # PatchTST is the default, but explicitly set for clarity
          unimodal_model_type: "PatchTST"
          seq_len: 96
          pred_len: 96
          d_model: 512
          revin: true
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 96
          output_len: 96
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with DLinear encoder
    - name: "zhanghanbest_dlinear_nyc_traffic_speed"
      description: "ZhangHanBest with DLinear encoder on NYC Traffic Speed (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "DLinear"
          seq_len: 96
          pred_len: 96
          d_model: 512  # ZhangHanBest will add projection layer if needed
          # DLinear doesn't use revin
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 96
          output_len: 96
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with Sundial encoder (Foundation model - requires input_len=360)
    # DISABLED: Sundial model has input shape compatibility issue
    # Error: ValueError: too many values to unpack (expected 2) at batch_size, seq_length = input_ids.shape
    # The cached model code expects 2D input [B, seq_len] but receives 3D input [B, seq_len, channels]
    # This is an issue in how the Sundial wrapper handles input shape for representation extraction
    - name: "zhanghanbest_sundial_nyc_traffic_speed"
      description: "ZhangHanBest with Sundial encoder on NYC Traffic Speed (1 epoch test) - Foundation model requires input_len=360 - DISABLED due to input shape compatibility issue"
      enabled: false
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "Sundial"
          seq_len: 360  # Foundation model requires seq_len=360
          pred_len: 24  # Foundation model standard pred_len
          d_model: 512  # ZhangHanBest will add projection layer if hidden_size != d_model
          # Sundial-specific configs (merged from model_configs/FM/Sundial.yaml)
          model_name: "thuml/sundial-base-128m"
          num_samples: 10
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 360  # Foundation model requires input_len=360
          output_len: 24  # Foundation model standard pred_len
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with TimeMoE encoder (Foundation model - requires input_len=360)
    # DISABLED: TimeMoE model has compatibility issue with current transformers version
    # Error: 'DynamicCache' object has no attribute 'get_usable_length'
    # The cached model code uses outdated API (get_usable_length vs get_seq_length)
    # This is an issue in the external TimeMoE HuggingFace model code, not our configuration
    - name: "zhanghanbest_timemoe_nyc_traffic_speed"
      description: "ZhangHanBest with TimeMoE encoder on NYC Traffic Speed (1 epoch test) - Foundation model requires input_len=360 - DISABLED due to transformers compatibility issue"
      enabled: false
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "TimeMoE"
          seq_len: 360  # Foundation model requires seq_len=360
          pred_len: 24  # Foundation model standard pred_len
          d_model: 512  # ZhangHanBest will add projection layer if hidden_size != d_model
          # TimeMoE-specific configs (merged from model_configs/FM/TimeMoE.yaml)
          model_name: "Maple728/TimeMoE-50M"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 360  # Foundation model requires input_len=360
          output_len: 24  # Foundation model standard pred_len
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ============================================================================
    # Time-MMD Dataset Experiments (faster testing with smaller dataset)
    # ============================================================================
    
    # ZhangHanBest with PatchTST encoder on Time-MMD Traffic dataset
    - name: "zhanghanbest_patchtst_time_mmd"
      description: "ZhangHanBest with PatchTST encoder on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "PatchTST"
          seq_len: 24
          pred_len: 6  # Smaller prediction length for time-mmd dataset (faster testing)
          d_model: 512
          revin: true
          input_text_dim: 768  # BERT embedding dimension
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        data_config:
          timemmd_text_output: embedding  # Use embeddings for ZhangHanBest model
        training:
          input_len: 24
          output_len: 6  # Smaller prediction length for time-mmd dataset (faster testing)
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with DLinear encoder on Time-MMD Traffic dataset
    - name: "zhanghanbest_dlinear_time_mmd"
      description: "ZhangHanBest with DLinear encoder on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "DLinear"
          seq_len: 24
          pred_len: 6  # Smaller prediction length for time-mmd dataset (faster testing)
          d_model: 512  # ZhangHanBest will add projection layer if needed
          input_text_dim: 768  # BERT embedding dimension
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        data_config:
          timemmd_text_output: embedding  # Use embeddings for ZhangHanBest model
        training:
          input_len: 24
          output_len: 6  # Smaller prediction length for time-mmd dataset (faster testing)
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with iTransformer encoder on Time-MMD Traffic dataset
    - name: "zhanghanbest_itransformer_time_mmd"
      description: "ZhangHanBest with iTransformer encoder on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "iTransformer"
          seq_len: 24
          pred_len: 6
          d_model: 512
          d_ff: 2048
          n_heads: 8
          e_layers: 2
          dropout: 0.1
          activation: 'gelu'
          use_norm: true  # iTransformer uses Non-stationary Transformer normalization
          input_text_dim: 768
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          input_len: 24
          output_len: 6
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with FITS encoder on Time-MMD Traffic dataset
    - name: "zhanghanbest_fits_time_mmd"
      description: "ZhangHanBest with FITS encoder on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "FITS"
          seq_len: 24
          pred_len: 6
          d_model: 512  # ZhangHanBest will add projection layer (FITS uses dominance_freq*2)
          individual: false
          H_order: 1
          base_T: 24
          input_text_dim: 768
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          input_len: 24
          output_len: 6
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with FEDformer encoder on Time-MMD Traffic dataset
    - name: "zhanghanbest_fedformer_time_mmd"
      description: "ZhangHanBest with FEDformer encoder on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "FEDformer"
          seq_len: 24
          label_len: 12  # Encoder-decoder model requires label_len
          pred_len: 6
          d_model: 512
          d_ff: 2048
          n_heads: 8
          e_layers: 2
          d_layers: 1
          dropout: 0.05
          activation: 'gelu'
          version: 'Fourier'
          mode_select: 'random'
          modes: 32
          moving_avg: 25
          embed: 'timeF'
          freq: 'h'
          input_text_dim: 768
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          input_len: 24
          output_len: 6
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
    # ZhangHanBest with Informer encoder on Time-MMD Traffic dataset
    - name: "zhanghanbest_informer_time_mmd"
      description: "ZhangHanBest with Informer encoder on Time-MMD Traffic (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "ZhangHanBest"
          config_path: "model_configs/general/ZhangHanBest.yaml"
        model_config_overrides:
          unimodal_model_type: "Informer"
          seq_len: 24
          label_len: 12  # Encoder-decoder model requires label_len
          pred_len: 6
          d_model: 512
          d_ff: 2048
          n_heads: 8
          e_layers: 2
          d_layers: 1
          dropout: 0.05
          activation: 'gelu'
          attn: 'prob'  # ProbSparse attention
          distil: true  # Self-attention distilling
          factor: 5
          embed: 'timeF'
          freq: 'h'
          input_text_dim: 768
        data:
          name: "time_mmd_traffic"
          config_path: "data_configs/time_mmd/Traffic/config.yaml"
        data_config:
          timemmd_text_output: embedding
        training:
          input_len: 24
          output_len: 6
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/zhanghanbest_test"
        wandb:
          enabled: false
    
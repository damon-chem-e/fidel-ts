# Experiment Suite: TGTSF Training Test
# Description: Test run for TGTSF training on a single dataset and prediction horizon
# Usage: python -m cli.suite run configs/experiment_suites/tgtsf_test.yaml
# NOTE: Currently contains 1 experiment. May extend to 2-3 experiments later for more thorough testing.

suite:
  name: "tgtsf_test"
  description: "Test run: Train TGTSF model on NYC Traffic Speed with 24-step prediction using PyTorch"
  tags: ["tgtsf", "multimodal", "pytorch", "test"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/tgtsf_test"
    
  # Experiments in this suite
  experiments:
    # NYC Traffic Speed - 24-step prediction (test run)
    - name: "tgtsf_nyc_traffic_speed_24"
      description: "TGTSF on NYC Traffic Speed with 24-step prediction (TEST)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 360
          output_len: 24
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/tgtsf_test"


# Experiment Suite: Time-LLM on Time MMD and TTC datasets
# Description: Train Time-LLM model on all Time MMD (Liu et al., 2024b) and TTC (Kim et al., 2024) datasets
# Usage: python -m cli.suite run configs/experiment_suites/timellm/time_mmd_ttc.yaml
# Note: Input/output lens follow Table 4 from the original papers:
#       - Time MMD datasets use 7:1:2 train/val/test ratio splits
#       - TTC datasets use 7:1:2 train/val/test ratio splits
#
# IMPORTANT: Time-LLM loads the frozen LLM backbone ONLINE during training.
# This is different from TimeCMA which uses pre-computed embeddings.
# No embedding pre-generation is required!
#
# Reference:
#   Jin et al., "Time-LLM: Time Series Forecasting by Reprogramming 
#   Large Language Models" (ICLR 2024)

suite:
  name: "timellm_time_mmd_ttc"
  description: "Train Time-LLM model on all Time MMD and TTC datasets (frozen GPT-2 backbone)"
  tags: ["timellm", "time-llm", "reprogramming", "llm", "frozen-backbone", "pytorch", "time_mmd", "ttc", "iclr2024"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/timellm/time_mmd_ttc"
    
  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================
    
    # Agriculture: context=24, prediction=6
    - name: "timellm_gpt2_timemmd_agriculture"
      description: "Time-LLM with frozen GPT-2 backbone on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeLLM"
          config_path: "model_configs/general/TimeLLM.yaml"
        data:
          name: "time_mmd_algriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        training:
          input_len: 24       # Context length from Table 4
          output_len: 6       # Prediction length from Table 4
          batch_size: 32
          learning_rate: 1e-4
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
          # Time-LLM specific training config
          time_llm:
            llm_backbone: "gpt2"
            quantization: null  # No quantization for GPT-2 (small model)
            prompt_domain: false
            loss: "mse"
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: true
          tags: ["timellm", "time_mmd_agriculture"]
        model_config_overrides:
          enc_in: 1           # Number of input channels
          llm_model: "gpt2"
          patch_len: 16
          stride: 8
          d_model: 16
          d_ff: 32
          n_heads: 8
          dropout: 0.1
          seq_len: 24
          pred_len: 6
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timellm/time_mmd_ttc"
    

# Experiment Suite: Time-LLM on NYC_traffic_speed
# Description: Train Time-LLM model on NYC_traffic_speed dataset
# Usage: python -m cli.suite run configs/experiment_suites/timellm/nyc_traffic_speed.yaml
# Note: NYC_traffic_speed uses hourly sampling (downsampled to -h)
#       Input: 360 samples = 15 days (half month), Output: 168 samples = 1 week (second smallest)
#       Split points: {Jan. 1, 2021, Jan. 1, 2022}
# This is a LARGE dataset (~30M observations)
#
# IMPORTANT: Time-LLM loads the frozen LLM backbone ONLINE during training.
# This is different from TimeCMA which uses pre-computed embeddings.
# No embedding pre-generation is required!
#
# Reference:
#   Jin et al., "Time-LLM: Time Series Forecasting by Reprogramming 
#   Large Language Models" (ICLR 2024)

suite:
  name: "timellm_nyc_traffic_speed"
  description: "Train Time-LLM model on NYC_traffic_speed dataset with 15-day context, 1-week prediction (frozen GPT-2 backbone)"
  tags: ["timellm", "time-llm", "reprogramming", "llm", "frozen-backbone", "pytorch", "fidel-ts", "nyc_traffic_speed", "iclr2024"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/timellm/nyc_traffic_speed"
    
  # Experiments in this suite
  experiments:
    - name: "timellm_gpt2_nyc_traffic_speed"
      description: "Time-LLM with frozen GPT-2 backbone on NYC_traffic_speed with 15-day context, 1-week prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TimeLLM"
          config_path: "model_configs/general/TimeLLM.yaml"
        data:
          name: "fidel_NYC_traffic_speed:fullNYCTS_hetero_TGTSF_H"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          text_embedding_stride: "full"  # Full resolution (NOTE: TimeLLM uses LLM backbone directly, not pre-embedded text, so this parameter is ignored)
          input_len: 360      # 15 days at hourly intervals (half month)
          output_len: 168     # 1 week at hourly intervals (second smallest: {24, 168, 336, 720})
          batch_size: 32
          learning_rate: 1e-5  # Ultra-conservative LR for NYC traffic (large dataset, zero values, high variance)
          patience: 5
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # Recommended mode
          # Time-LLM specific training config
          time_llm:
            llm_backbone: "gpt2"
            quantization: null  # No quantization for GPT-2 (small model)
            prompt_domain: false
            loss: "mse"
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: true
          tags: ["timellm", "nyc_traffic_speed"]
        model_config_overrides:
          # NYC Traffic Speed has 1 target (SPEED)
          enc_in: 1           # Number of input channels
          # Time-LLM architecture parameters (original config)
          llm_model: "gpt2"
          patch_len: 16
          stride: 8
          d_model: 16         # Patch embedding dimension
          d_ff: 32            # Feed-forward dimension
          n_heads: 8          # Attention heads for reprogramming
          dropout: 0.1
          # Sequence configuration
          seq_len: 360
          pred_len: 168
          # Training stability overrides for NYC traffic (large dataset, zero values, high variance)
          grad_clip_max_norm: 0.3  # More aggressive gradient clipping (default: 1.0)
          mapping_layer_gain: 0.05  # Ultra-conservative mapping layer init (default: 0.1)
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/timellm/nyc_traffic_speed"

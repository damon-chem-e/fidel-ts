# Experiment Suite: Zero-Shot Evaluation
# Description: Zero-shot evaluation of trained models on zero-shot datasets
# Usage: python -m cli.suite run configs/experiment_suites/zero_shot_evaluation.yaml

suite:
  name: "zero_shot_evaluation"
  description: "Evaluate trained models on zero-shot datasets (models trained on one dataset, tested on zero-shot variant)"
  tags: ["zero-shot", "evaluation", "transfer"]
  
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/zero_shot"
    
  experiments:
    # DLinear - Zero-shot
    - name: "dlinear_zero_shot_nyc_traffic_speed"
      description: "DLinear zero-shot evaluation on NYC Traffic Speed"
      enabled: true
      template: "configs/templates/evaluation.yaml"
      overrides:
        model:
          name: "DLinear"
        data:
          name: "NYC_traffic_speed"
        evaluation:
          model: "DLinear"
          data: "NYC_traffic_speed"
          version: "latest"
          input_len: 360
          output_lens: [24, 168, 336, 720]
          batch_size: 128
          device: "0"
          task: "TSF"
          data_config: "data_configs/NYC_traffic_speed/fullNYCTS_zero_shot_H.yaml"
        experiment:
          type: "evaluation"
          
    - name: "dlinear_zero_shot_bear_room"
      description: "DLinear zero-shot evaluation on Bear Room"
      enabled: true
      template: "configs/templates/evaluation.yaml"
      overrides:
        model:
          name: "DLinear"
        data:
          name: "Bear_room"
        evaluation:
          model: "DLinear"
          data: "Bear_room"
          version: "latest"
          input_len: 360
          output_lens: [24, 168, 336, 720]
          batch_size: 128
          device: "0"
          task: "TSF"
          data_config: "data_configs/Bear_room/fullBear_zero_shot.yaml"

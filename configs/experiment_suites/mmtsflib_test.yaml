          n_heads: 4
          e_layers: 3
          d_ff: 128
          patch_len: 16
          stride: 8
          revin: true
          input_text_dim: 768  # GPT-2 base hidden dimension
          prompt_weight_mode: "fixed"
          prompt_weight: 0.01
          pool_type: "avg"
        data:

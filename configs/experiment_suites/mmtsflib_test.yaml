# Experiment Suite: MMTSFlib Model Test
# Description: Test MMTSFlib (prediction-level late fusion) with supported unimodal encoders for 1 epoch each
# Usage: python -m cli.suite run configs/experiment_suites/mmtsflib_test.yaml
# Purpose: Verify that MMTSFlib works correctly with each unimodal encoder type and both prompt_weight modes

suite:
  name: "mmtsflib_test"
  description: "Test MMTSFlib model with supported unimodal encoders (iTransformer, PatchTST, DLinear) and learned/fixed weight modes - 1 epoch each"
  tags: ["mmtsflib", "multimodal", "pytorch", "test", "tgtsf", "late-fusion"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/mmtsflib_test"
  
  # Experiments in this suite
  experiments:
    # ============================================================================
    # NYC Traffic Speed Experiments
    # ============================================================================
    
    # MMTSFlib with iTransformer (default encoder) - Fixed prompt weight
    - name: "mmtsflib_itransformer_fixed_nyc_traffic_speed"
      description: "MMTSFlib with iTransformer encoder (fixed prompt_weight) on NYC Traffic Speed (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "MMTSFlib"
          config_path: "model_configs/general/MMTSFlib.yaml"
        model_config_overrides:
          unimodal_model_type: "iTransformer"
          seq_len: 96
          pred_len: 96
          d_model: 512
          n_heads: 8
          e_layers: 2
          d_ff: 2048
          input_text_dim: 768  # BERT embedding dimension
          prompt_weight_mode: "fixed"
          prompt_weight: 0.01
          pool_type: "avg"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 96
          output_len: 96
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/mmtsflib_test"
        wandb:
          enabled: false
    
    # MMTSFlib with iTransformer - Learned prompt weight
    - name: "mmtsflib_itransformer_learned_nyc_traffic_speed"
      description: "MMTSFlib with iTransformer encoder (learned prompt_weight) on NYC Traffic Speed (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "MMTSFlib"
          config_path: "model_configs/general/MMTSFlib.yaml"
        model_config_overrides:
          unimodal_model_type: "iTransformer"
          seq_len: 96
          pred_len: 96
          d_model: 512
          n_heads: 8
          e_layers: 2
          d_ff: 2048
          input_text_dim: 768  # BERT embedding dimension
          prompt_weight_mode: "learned"
          prompt_weight_initial: 0.01
          pool_type: "avg"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 96
          output_len: 96
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/mmtsflib_test"
        wandb:
          enabled: false
    
    # MMTSFlib with PatchTST encoder
    - name: "mmtsflib_patchtst_nyc_traffic_speed"
      description: "MMTSFlib with PatchTST encoder on NYC Traffic Speed (1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"

# Experiment Suite: Test/Evaluation (Full Dataset)
# Description: Full dataset evaluation of trained models (not filtered samples)
# Usage: python -m cli.suite run configs/experiment_suites/test_evaluation.yaml

suite:
  name: "test_evaluation_full_dataset"
  description: "Evaluate trained models on full test datasets"
  tags: ["testing", "evaluation", "full_dataset"]
  
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/test_evaluation"
    
  experiments:
    # PatchTST - Full Dataset Evaluation (Lightning)
    - name: "patchtst_test_nyc_traffic_speed"
      description: "PatchTST full dataset evaluation on NYC Traffic Speed"
      enabled: true
      template: "configs/templates/evaluation.yaml"
      overrides:
        model:
          name: "PatchTST"
        data:
          name: "NYC_traffic_speed"
        evaluation:
          model: "PatchTST"
          data: "NYC_traffic_speed"
          version: "latest"
          input_len: 360
          output_lens: [24, 168, 336, 720]
          batch_size: 512
          device: "2"
          task: "TSF"
        experiment:
          type: "evaluation"
          output_dir: "outputs/suites/test_evaluation"
    
    - name: "patchtst_test_california_iso"
      description: "PatchTST full dataset evaluation on California ISO"

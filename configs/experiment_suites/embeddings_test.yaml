          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/embeddings_test"
        wandb:
          enabled: false
    
    # Lynx Film Raw with new embeddings (average aggregation) (1 epoch)
    - name: "lynx_film_raw_new_embeddings_average"
      description: "lynx_film_raw on NYC Traffic Speed with new embeddings (average aggregation, 1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:

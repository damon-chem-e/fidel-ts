        training:
          input_len: 360
          output_len: 24
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 1
          track_per_sample: false
          evaluate_test_during_training: false
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/embeddings_test"
        wandb:
          enabled: false
    
    # TGTSF with new embeddings (average aggregation) (1 epoch)
    - name: "tgtsf_new_embeddings_average"
      description: "TGTSF on NYC Traffic Speed with new embeddings (average aggregation, 1 epoch test)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        data:
          name: "NYC_traffic_speed"

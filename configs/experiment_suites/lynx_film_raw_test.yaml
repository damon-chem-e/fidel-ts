# Experiment Suite: lynx_film_raw Training Test
# Description: Test run for lynx_film_raw training on a single dataset and prediction horizon
# Usage: python -m cli.suite run configs/experiment_suites/lynx_film_raw_test.yaml
# NOTE: Currently contains 1 experiment. May extend to 2-3 experiments later for more thorough testing.

suite:
  name: "lynx_film_raw_test"
  description: "Test run: Train lynx_film_raw model on NYC Traffic Speed with 24-step prediction using PyTorch"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "test", "film"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film_raw_test"
    
  # Experiments in this suite
  experiments:
    # NYC Traffic Speed - 24-step prediction (test run)
    - name: "lynx_film_raw_nyc_traffic_speed_24"
      description: "lynx_film_raw on NYC Traffic Speed with 24-step prediction (TEST)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        training:
          input_len: 360
          output_len: 24
          batch_size: 768
          learning_rate: 8.66e-4
          patience: 5
          epochs: 50
          track_per_sample: false  # Disable per-sample tracking for initial training
          evaluate_test_during_training: false  # Only evaluate test at final epoch
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw_test"


        model_config_overrides:
          # Core architecture (match baseline)
          d_model: 1024
          e_layers: 2
          n_heads: 8
          input_text_dim: 768
          # Enhanced options
          pathway_type: "shared"
          gate_type: "conditional"
          mixing_type: "interpolative"
          gate_hidden_dim: 32
          gate_init_bias: 0.0
        data:

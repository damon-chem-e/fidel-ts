        data_config:
          timemmd_text_output: embedding
        training:
          input_len: 24
          output_len: 6
          batch_size: 12
          learning_rate: 0.00022
          patience: 2
          epochs: 1               # Single epoch for quick test
          track_per_sample: false
          evaluate_test_during_training: true
          truncate_train_for_purge: true
        wandb:

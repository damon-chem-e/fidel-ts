# Experiment Suite: lynx_film_raw NYC Traffic Sweep
# Description: Hyperparameter sweep for lynx_film_raw on NYC_traffic_speed dataset
# Usage: Used with wandb sweep for architecture (e_layers, d_model, n_heads) and training (LR, batch_size) parameters
# NOTE: NYC_traffic_speed uses hourly sampling with 15-day context (360h) and 1-week prediction (168h)

suite:
  name: "lynx_film_raw_nyc_traffic_sweep"
  description: "Hyperparameter sweep: lynx_film_raw on NYC_traffic_speed (architecture + training params, 30 epochs)"
  tags: ["lynx_film_raw", "multimodal", "pytorch", "sweep", "film", "fidel-ts", "nyc_traffic_speed"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/lynx_film_raw_nyc_traffic_sweep"
    
  # Experiments in this suite
  experiments:
    # NYC_traffic_speed - hyperparameter sweep with architecture parameters
    - name: "lynx_film_raw_nyc_traffic_sweep"
      description: "lynx_film_raw on NYC_traffic_speed (SWEEP - architecture + training params)"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        model_config_overrides:
          input_text_dim: 768  # BERT embedding dimension (projects 768 -> text_dim=256)
          # e_layers, d_model, n_heads will be overridden by sweep
          # Default values (middle of sweep ranges):
          e_layers: 3
          d_model: 512
          n_heads: 8
        data:
          name: "NYC_traffic_speed"
          config_path: "data_configs/NYC_traffic_speed/fullNYCTS_hetero_TGTSF_H.yaml"
        data_config:
          # NYC traffic speed specific configs (if needed)
        training:
          text_embedding_stride: "full"  # Full resolution text embeddings (recommended)
          input_len: 360      # 15 days at hourly intervals (half month) - matches nyc_traffic_speed.yaml
          output_len: 168     # 1 week at hourly intervals (second smallest: {24, 168, 336, 720}) - matches nyc_traffic_speed.yaml
          batch_size: 128     # Will be overridden by sweep (default in middle of range)
          learning_rate: 3e-4 # Will be overridden by sweep (default in middle of log range)
          patience: 7         # Patience of 7 as requested
          epochs: 30          # 30 epochs as requested
          track_per_sample: false
          evaluate_test_during_training: true   # Enable to log test_loss per-epoch for evaluation
          truncate_train_for_purge: true        # Remove lookahead bias, making val_loss reliable
          torch_compile: true  # Enable torch.compile for faster training
          compile_mode: "reduce-overhead"  # reduce overhead and improve performance
        wandb:
          tags: ["lynx_film_raw", "nyc_traffic_speed", "sweep"]
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/lynx_film_raw_nyc_traffic_sweep"

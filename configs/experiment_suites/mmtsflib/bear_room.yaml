# Experiment Suite: MMTSFlib on Bear_room
# Description: Train MMTSFlib (prediction-level late fusion) with FEDformer on Bear_room dataset
# Usage: python -m cli.suite run configs/experiment_suites/mmtsflib/bear_room.yaml
# Note: Bear_room uses 5-minute sampling (NOT downsampled to hourly)
#       Input: 288 samples = 1 day at 5-min intervals, Output: 144 samples = 12 hours at 5-min intervals
#       Split points: {Jan. 1, 2021, Jan. 1, 2022}
#
# IMPORTANT: This suite requires pre-computed LLM embeddings!
# Generate embeddings first:
#   python -m cli.inference generate-suite configs/experiment_suites/mmtsflib/bear_room.yaml

suite:
  name: "mmtsflib_bear_room"
  description: "Train MMTSFlib with FEDformer on Bear_room dataset with 1-day context, 12-hour prediction"
  tags: ["mmtsflib", "multimodal", "late-fusion", "fedformer", "pytorch", "fidel-ts", "bear_room"]

  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/mmtsflib/bear_room"

  # Experiments in this suite
  experiments:
    - name: "mmtsflib_fedformer_bear_room"
      description: "MMTSFlib with FEDformer on Bear_room with 1-day context, 12-hour prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "MMTSFlib"
          config_path: "model_configs/general/MMTSFlib.yaml"
        data:
          name: "fidel_Bear_room:fullBear_hetero_TGTSF"
          config_path: "data_configs/Bear_room/fullBear_hetero_TGTSF.yaml"
        training:
          input_len: 288      # 1 day at 5-minute intervals
          output_len: 144     # 12 hours at 5-minute intervals
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true
          torch_compile: true
          compile_mode: "reduce-overhead"
          use_tensor_cache: false  # Disable tensor cache
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: true
          tags: ["mmtsflib", "bear_room"]
        llm_embedding:
          model_name: "gpt2"
          cache_dir: "./LLM_cache/"
          extraction_mode: "last_token"
          max_length: 512
          prompt_template: "mmtsflib_v1"
          # Memory-efficient mode for Fidel-TS dataset
          memory_efficient: true
          batch_size: 64
          chunk_size: 1000
        model_config_overrides:
          unimodal_model_type: "FEDformer"
          seq_len: 288
          pred_len: 144
          enc_in: 1           # Bear room has 1 target
          d_model: 512
          n_heads: 8
          e_layers: 2
          d_layers: 1
          d_ff: 2048
          modes: 32
          mode_select: "random"
          moving_avg: 25
          embed: "timeF"
          freq: "t"  # 5-minute data requires minutely frequency for time features
          input_text_dim: 768
          prompt_weight_mode: "fixed"
          prompt_weight: 0.01
          pool_type: "avg"
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/mmtsflib/bear_room"

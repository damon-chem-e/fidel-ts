# Experiment Suite: MMTSFlib on Time MMD and TTC datasets
# Description: Train MMTSFlib (prediction-level late fusion) with FEDformer on Time MMD and TTC datasets
# Usage: python -m cli.suite run configs/experiment_suites/mmtsflib/time_mmd_ttc.yaml
# Note: Input/output lens follow Table 4 from the original papers
#
# IMPORTANT: This suite requires pre-computed LLM embeddings!
# Generate embeddings first:
#   python -m cli.inference generate-suite configs/experiment_suites/mmtsflib/time_mmd_ttc.yaml

suite:
  name: "mmtsflib_time_mmd_ttc"
  description: "Train MMTSFlib with FEDformer on all Time MMD and TTC datasets"
  tags: ["mmtsflib", "multimodal", "late-fusion", "fedformer", "pytorch", "time_mmd", "ttc"]

  # Execution settings
  execution:
    parallel: false
    continue_on_error: true
    log_dir: "./logs/suites/mmtsflib/time_mmd_ttc"

  # Experiments in this suite
  experiments:
    # ===========================================
    # Time MMD Datasets (Liu et al., 2024b)
    # ===========================================

    # Agriculture: context=24, prediction=6
    - name: "mmtsflib_fedformer_timemmd_agriculture"
      description: "MMTSFlib with FEDformer on Time MMD Agriculture dataset"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "MMTSFlib"
          config_path: "model_configs/general/MMTSFlib.yaml"
        data:
          name: "time_mmd_algriculture"
          config_path: "data_configs/time_mmd/Algriculture/config.yaml"
        training:
          input_len: 24
          output_len: 6
          batch_size: 256
          learning_rate: 1e-3
          patience: 10
          epochs: 50
          track_per_sample: false
          evaluate_test_during_training: false
          truncate_train_for_purge: true
          torch_compile: true
          compile_mode: "reduce-overhead"
          use_tensor_cache: false  # Disable tensor cache
        device:
          use_gpu: true
          gpu: 0
          use_multi_gpu: false
          devices: "0"
        wandb:
          enabled: true
          tags: ["mmtsflib", "time_mmd_algriculture"]
        llm_embedding:
          model_name: "gpt2"
          cache_dir: "./LLM_cache/"
          extraction_mode: "last_token"
          max_length: 512
          prompt_template: "mmtsflib_v1"
          batch_size: 64
        model_config_overrides:
          unimodal_model_type: "FEDformer"
          seq_len: 24
          pred_len: 6
          enc_in: 1
          d_model: 512
          n_heads: 8
          e_layers: 2
          d_layers: 1
          d_ff: 2048
          modes: 32
          mode_select: "random"
          moving_avg: 25
          embed: "timeF"
          freq: "h"
          input_text_dim: 768
          prompt_weight_mode: "fixed"
          prompt_weight: 0.01
          pool_type: "avg"
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/mmtsflib/time_mmd_ttc"


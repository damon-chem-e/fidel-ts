# Experiment Suite: TTC Datasets Test
# Description: Test TGTSF and lynx_film_raw on TTC climate and medical datasets
# Usage: python -m cli.suite run configs/experiment_suites/ttc_test.yaml

suite:
  name: "ttc_test"
  description: "Test TGTSF and lynx_film_raw models on TTC climate and medical datasets with 24-step prediction"
  tags: ["ttc", "multimodal", "pytorch", "test", "tgtsf", "lynx_film_raw"]
  
  # Execution settings
  execution:
    parallel: false
    continue_on_error: false
    log_dir: "./logs/suites/ttc_test"
    
  # Experiments in this suite
  experiments:
    # TTC Climate - TGTSF
    - name: "tgtsf_ttc_climate_24"
      description: "TGTSF on TTC Climate dataset with 24-step prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        data:
          name: "ttc_climate"
          config_path: "data_configs/ttc/climate/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 8.66e-4
          patience: 5
          epochs: 1
          track_per_sample: false  # Disable per-sample tracking for initial training
          evaluate_test_during_training: false  # Only evaluate test at final epoch
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
        wandb:
          enabled: false  # Disable wandb for test runs
        # Model config override: Set input_text_dim to match BERT output (768) and enc_in for multivariate data
        model_config_overrides:
          input_text_dim: 768  # BERT output dimension (models will project to text_dim: 256)
          enc_in: 4  # Number of features: temp, precip, humidity, windspeed
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/ttc_test"
    
    # TTC Climate - lynx_film_raw
    - name: "lynx_film_raw_ttc_climate_24"
      description: "lynx_film_raw on TTC Climate dataset with 24-step prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        data:
          name: "ttc_climate"
          config_path: "data_configs/ttc/climate/config.yaml"
        training:
          input_len: 96
          output_len: 24
          batch_size: 32
          learning_rate: 8.66e-4
          patience: 5
          epochs: 1
          track_per_sample: false  # Disable per-sample tracking for initial training
          evaluate_test_during_training: false  # Only evaluate test at final epoch
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
        wandb:
          enabled: false  # Disable wandb for test runs
        # Model config override: Set input_text_dim to match BERT output (768) and enc_in for multivariate data
        model_config_overrides:
          input_text_dim: 768  # BERT output dimension (models will project to text_dim: 256)
          enc_in: 4  # Number of features: temp, precip, humidity, windspeed
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/ttc_test"
    
    # TTC Medical - TGTSF
    - name: "tgtsf_ttc_medical_24"
      description: "TGTSF on TTC Medical dataset with 24-step prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "TGTSF"
          config_path: "model_configs/general/TGTSF.yaml"
        data:
          name: "ttc_medical"
          config_path: "data_configs/ttc/medical/config.yaml"
        data_config:
          filter_insufficient_entities: true  # Filter out entities without enough data for 7/7 input/output with 70/10/20 split
          missing_value_strategy: forward_fill_indicators  # Forward fill missing values and create indicator variables
        training:
          input_len: 7
          output_len: 7
          batch_size: 32
          learning_rate: 8.66e-4
          patience: 5
          epochs: 1
          track_per_sample: false  # Disable per-sample tracking for initial training
          evaluate_test_during_training: false  # Only evaluate test at final epoch
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
        wandb:
          enabled: false  # Disable wandb for test runs
        # Model config override: Set input_text_dim to match BERT output (768) and enc_in for multivariate data
        model_config_overrides:
          input_text_dim: 768  # BERT output dimension (models will project to text_dim: 256)
          enc_in: 4  # Number of features: Respiratory_Rate, Heart_Rate, SaO2, FiO2
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/ttc_test"
    
    # TTC Medical - lynx_film_raw
    - name: "lynx_film_raw_ttc_medical_24"
      description: "lynx_film_raw on TTC Medical dataset with 24-step prediction"
      enabled: true
      template: "configs/templates/pytorch_training.yaml"
      overrides:
        model:
          name: "lynx_film_raw"
          config_path: "model_configs/general/lynx_film_raw.yaml"
        data:
          name: "ttc_medical"
          config_path: "data_configs/ttc/medical/config.yaml"
        data_config:
          filter_insufficient_entities: true  # Filter out entities without enough data for 7/7 input/output with 70/10/20 split
          missing_value_strategy: forward_fill_indicators  # Forward fill missing values and create indicator variables
        training:
          input_len: 7
          output_len: 7
          batch_size: 32
          learning_rate: 8.66e-4
          patience: 5
          epochs: 1
          track_per_sample: false  # Disable per-sample tracking for initial training
          evaluate_test_during_training: false  # Only evaluate test at final epoch
          truncate_train_for_purge: true  # Remove lookahead bias, making val_loss reliable
        wandb:
          enabled: false  # Disable wandb for test runs
        # Model config override: Set input_text_dim to match BERT output (768) and enc_in for multivariate data
        model_config_overrides:
          input_text_dim: 768  # BERT output dimension (models will project to text_dim: 256)
          enc_in: 4  # Number of features: Respiratory_Rate, Heart_Rate, SaO2, FiO2
        experiment:
          type: "pytorch"
          output_dir: "outputs/suites/ttc_test"

# Test configuration for Time-MMD dataset with TGTSF (text-guided model)
# This tests text data integration
# Usage: python -m cli.train pytorch configs/experiments/time_mmd_test_tgtsf.yaml

model:
  name: TGTSF
  config_path: model_configs/general/TGTSF.yaml

data:
  name: time_mmd_traffic
  config_path: data_configs/time_mmd/Traffic/config.yaml

training:
  experiment_output: ./output
  epochs: 1  # Single epoch for testing
  batch_size: 4  # Small batch size for testing
  learning_rate: 5e-4
  patience: 3
  loss: mse
  lradj: type3
  scale: true
  disable_buffer: false
  preload_hetero: false
  prefetch_factor: 2
  noise: 0.0
  input_len: 96
  output_len: 24
  num_workers: 0

device:
  use_gpu: true
  gpu: 0
  use_multi_gpu: false
  devices: "0"

# Disable wandb for quick test runs
wandb:
  enabled: false

# Optional: HuggingFace settings
hf_mirror: false
hf_offline: false

# Base data path override (replaces './data' in data config paths)
# Set this to an absolute path if running from a different working directory
base_data_path: /nfs/sloanlab007/projects/chimera_proj/fidel-ts/data/

# Override data config settings for TGTSF (requires embeddings, not raw text)
data_config:
  timemmd_text_output: embedding  # Override: use embeddings for TGTSF model

# Model config override: Set input_text_dim to match BERT output (768)
# The model will learn a projection from 768 -> 256 (text_dim) internally
model_config:
  input_text_dim: 768  # BERT output dimension (models will project to text_dim: 256)


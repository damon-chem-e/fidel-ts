# LeRet Experiment Configuration - ETTh1 Dataset
#
# This configuration demonstrates LeRet's two-stage training:
# - Stage 1 (Pretrain): Auto-regressive pretraining with patch reconstruction loss
# - Stage 2 (Finetune): Forecasting finetuning with sequence prediction loss
#
# Usage:
#   python run.py --config configs/experiments/leret_etth1.yaml
#
# Training stages can be configured via training.leret.training_stage:
#   - "both": Run pretrain then finetune (recommended)
#   - "pretrain": Run pretrain stage only
#   - "finetune": Run finetune stage only (requires pretrain checkpoint)

# =============================================================================
# Model Configuration
# =============================================================================
model:
  name: LeRet
  config_path: model_configs/general/LeRet.yaml

# =============================================================================
# Data Configuration
# =============================================================================
data:
  name: ETTh1
  config_path: data_configs/ETT/ETTh1.yaml

# =============================================================================
# Training Configuration
# =============================================================================
training:
  # Base training parameters (used for finetune stage)
  epochs: 100                   # Finetune epochs
  batch_size: 32
  learning_rate: 0.0001
  patience: 10                  # Early stopping patience
  loss: mse                     # Default loss (overridden by leret config)
  lradj: type3                  # Learning rate adjustment strategy
  
  # Data loading
  scale: true
  num_workers: 4
  prefetch_factor: 2
  
  # Lightning settings
  precision: 32                 # Training precision (32/16/bf16)
  gradient_clip_val: 1.0        # Gradient clipping
  test_after_epoch: false       # Run test after each epoch
  
  # LeRet-specific two-stage training configuration
  leret:
    # Training stage: "pretrain", "finetune", or "both"
    # - "both": Run pretrain first, then finetune (recommended for new experiments)
    # - "pretrain": Run only pretrain stage (useful for distributed pretraining)
    # - "finetune": Run only finetune stage (requires pretrain_checkpoint)
    training_stage: "both"
    
    # Stage 1 (Pretrain) configuration
    pretrain_epochs: 10         # Number of pretrain epochs
    pretrain_loss: "mse"        # Loss for patch reconstruction
    pretrain_learning_rate: 0.001  # Optional: different LR for pretrain
    
    # Stage 2 (Finetune) configuration
    finetune_loss: "mse"        # Loss for forecasting
    
    # Pretrain checkpoint (only needed if training_stage="finetune")
    # If not specified, auto-detected from same experiment
    # pretrain_checkpoint: null

# =============================================================================
# Device Configuration
# =============================================================================
device:
  use_gpu: true
  gpu: 0
  use_multi_gpu: false

# =============================================================================
# Weights & Biases (wandb) Configuration
# =============================================================================
wandb:
  project: "fidel-ts"
  entity: null                  # Your wandb entity/team
  tags:
    - "LeRet"
    - "ETTh1"
    - "two-stage"
  notes: "LeRet two-stage training on ETTh1 dataset"
  enabled: false                # Disabled for testing
  mode: "disabled"

# =============================================================================
# Model Configuration Overrides
# =============================================================================
# Override model parameters for this specific experiment
# enc_in MUST be set to match the dataset's number of channels
model_config_overrides:
  enc_in: 7                     # ETTh1 has 7 channels
  
  # Optional architecture overrides
  # d_model: 128
  # n_heads: 8
  # e_layers: 3
  # d_ff: 256
  
  # Optional patching overrides
  # patch_len: 16
  # stride: 8
  
  # Language integration (if using text embeddings)
  # use_language: true
  # language_dim: 768

# =============================================================================
# Experiment Metadata
# =============================================================================
random_seed: 2021


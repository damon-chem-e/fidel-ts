# Timestamp semantics: t_known means timestamps represent WHEN the text WAS PUBLISHED
# For TGTSF models, this means using historical_events (x_hetero) to avoid lookahead bias.
timestamp_semantics: t_known

root_path: ./data/time_mmd/Climate
data_path: US_precipitation_month.csv
spliter: ratio
split_info: [7, 1, 2]  # Match MM-TSFlib default: 70% train, 10% val, 20% test
timestamp_col: date
target: OT
id: all
formatter: US_precipitation_month.csv
id_info: id_info.json  # Minimal id_info.json will be auto-created if not present
dataset_type: time_mmd  # Flag to use TimeMMD_Dataset
text_column: auto  # Auto-detect Final_Search_* or Final_Output
use_closedllm: false  # Whether to use Final_Output column
text_len: 4  # For Final_Search_{text_len} detection
general_info: "US Precipitation monthly time series data"
channel_info: ""  # Empty string for single-entity datasets
time_zone: null
downsample: null
sampling_rate: 1month
base_T: 12

# Text embedding configuration (for models like TGTSF, LYNX)
# Set timemmd_text_output to 'text' for ChatTime (uses raw text)
# Set timemmd_text_output to 'embedding' for TGTSF/LYNX (uses embeddings)
timemmd_text_output: text  # 'text' | 'embedding'
timemmd_embed_model: bert-base-uncased  # HuggingFace model for embedding (default: bert-base-uncased)
timemmd_embed_dim: 768  # Embedding dimension (default: 768 for BERT)
timemmd_force_reembed: false  # If true, recompute embeddings even if .pkl exists
hf_cache_dir: ./HF_cache/  # Local cache for HF models (default: ./HF_cache/)


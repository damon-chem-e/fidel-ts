root_path: ./data/California_ISO/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2021-01-01'
  - '2022-01-01'
timestamp_col: Time
target: all
  # - "Current demand"
id_info: id_info.json  # Changed from id_info_except_battery.json to match "all" id
id:   
  - "all"  # Changed from "all_except_battery" to match static_info.json
formatter: '{i}.parquet'
downsample: 12
sampling_rate: 1h
base_T: 24
hetero_info:
  hetero_type: all_for_one  # all_for_one, each_subset
  root_path: ./data/California_ISO/weather/merged_report_embedding
  formatter: merged_general_weather_forecast.json  # Raw text (re-embedded with new system)
  matching: backward
  input_format: embedding
  static_path: static_info_embeddings_except_battery.pkl  # Path resolver overrides this for re-embedding
  # Timestamp semantics: t_about means timestamps represent WHAT TIME the text DESCRIBES
  timestamp_semantics: t_about
  # Use new embedding system with BERT (generates 768-dim embeddings consistently)
  use_old_embeddings: false
  embedding_config:
    model_name: bert-base-uncased  # 768-dim embeddings
    aggregation_method: cls  # Use [CLS] token embedding

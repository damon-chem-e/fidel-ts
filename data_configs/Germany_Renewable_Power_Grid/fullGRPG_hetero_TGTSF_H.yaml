root_path: ./data/Germany_Renewable_Power_Grid/impute_data
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2015-01-01' # discard data before 2015
  - '2021-01-01'
  - '2022-01-01'
  - '2025-02-26' # fit the requirements in data_helper.py
timestamp_col: time
target: all
  # - power
id_info: id_info.json
id: all
formatter: '{i}.parquet'
downsample: 4
sampling_rate: 1h
base_T: 24
time_zone: Europe/Berlin
hetero_info:
  hetero_type: all_for_one  # all_for_one, each_subset
  root_path: ./data/Germany_Renewable_Power_Grid/weather/merged_report_embedding
  formatter: merged_general_weather_report.json  # Raw text (re-embedded with new system)
  matching: backward
  input_format: embedding
  static_path: static_info_embeddings.pkl  # Path resolver overrides this for re-embedding
  # Timestamp semantics: t_about means timestamps represent WHAT TIME the text DESCRIBES
  timestamp_semantics: t_about
  # Use new embedding system with BERT (generates 768-dim embeddings consistently)
  use_old_embeddings: false
  embedding_config:
    model_name: bert-base-uncased  # 768-dim embeddings
    aggregation_method: cls  # Use [CLS] token embedding
